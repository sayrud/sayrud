<svg xmlns="http://www.w3.org/2000/svg" width="1306" height="556" viewBox="0 0 1306 556" role="img" xml:lang="en" aria-labelledby="title description">
  <title id="title">Sayrud collaborative spreadsheet</title>
  <desc id="description">An illustrative product roadmap in Sayrud, following the homepage preview layout. Grid, kanban, gallery, and form views share a table with text, single-select, multi-select, date, number, checkbox, and formula fields. Online teammates Alex and Jamie select cells together. The toolbar includes field visibility, filtering, grouping, sorting, row height, undo, redo, and search. Sample Points values are twice the Effort values.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif; font-size: 14px; fill: #ebebec; }
    .caption { fill: #a6a8ad; }
    .muted { fill: #7c7f85; }
    .small { font-size: 12px; }
    .heading { font-size: 13px; font-weight: 500; }
    .primary { fill: #4c88ff; }
    .white { fill: #fff; }
    .tag { fill: #fff; font-size: 13px; font-weight: 500; text-anchor: middle; }
    .numeric { text-anchor: end; font-variant-numeric: tabular-nums; }
    .icon { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; color: #a6a8ad; }
    .grid { fill: none; stroke: #2f3034; }
  </style>
  <defs>
    <clipPath id="window"><rect x="1" y="1" width="1304" height="554" rx="9"/></clipPath>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="table" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM3 9h18M9 9v12"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><path d="M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6"/></symbol>
    <symbol id="collapse" viewBox="0 0 24 24"><path d="m11 7-5 5 5 5m6-10-5 5 5 5"/></symbol>
    <symbol id="cloud" viewBox="0 0 24 24"><path d="M20 16.5A4.5 4.5 0 0 0 18 8a6 6 0 0 0-11.5-1.5A5.5 5.5 0 0 0 7 17h3m3-1 2 2 5-5"/></symbol>
    <symbol id="share" viewBox="0 0 24 24"><path d="M20 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM8.6 10.5l5.8-4M8.6 13.5l5.8 4"/></symbol>
    <symbol id="kanban" viewBox="0 0 24 24"><path d="M3 3h5v18H3Zm7 0h5v12h-5Zm7 0h4v16h-4Z"/></symbol>
    <symbol id="gallery" viewBox="0 0 24 24"><path d="M3 3h7v7H3Zm11 0h7v7h-7ZM3 14h7v7H3Zm11 0h7v7h-7Z"/></symbol>
    <symbol id="form" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm3 5h6m-6 4h6m-6 4h3"/></symbol>
    <symbol id="fields" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.8 10.8 0 0 1 22 12a13.9 13.9 0 0 1-3.4 4.4M6.3 6.3A13.9 13.9 0 0 0 2 12a10.8 10.8 0 0 0 14.2 7.4"/></symbol>
    <symbol id="filter" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10m-6 7h2"/></symbol>
    <symbol id="group" viewBox="0 0 24 24"><path d="M3 3h6v7H3Zm0 11h6v7H3ZM13 5h8m-8 4h8m-8 7h8m-8 4h8"/></symbol>
