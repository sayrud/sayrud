    <symbol id="rows" viewBox="0 0 24 24"><path d="M3 3h18v18H3ZM3 9h18M3 15h18"/></symbol>
    <symbol id="undo" viewBox="0 0 24 24"><path d="M3 10h11a7 7 0 0 1 7 7v3M3 10l6-6m-6 6 6 6"/></symbol>
    <symbol id="redo" viewBox="0 0 24 24"><path d="M21 10H10a7 7 0 0 0-7 7v3m18-10-6-6m6 6-6 6"/></symbol>
