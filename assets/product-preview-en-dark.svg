    <symbol id="checked" viewBox="0 0 16 16"><rect width="16" height="16" rx="4" fill="#4c88ff"/><path d="m4 8 2.5 2.5L12 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
