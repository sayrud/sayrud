services:
  sayrud:
    image: ghcr.io/sayrud/sayrud:latest
    restart: unless-stopped
    ports:
      - "2830:2830"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_ADDRESS: redis:6379
    configs:
      - source: sayrud
        target: /home/app/config/sayrud.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: sayrud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sayrud"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

configs:
  sayrud:
    content: |
      app:
        port: 2830
      postgres:
        dsn: host=postgres port=5432 user=postgres dbname=sayrud sslmode=disable

volumes:
  postgres_data:
