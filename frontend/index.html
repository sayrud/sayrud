<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayrud</title>
  </head>
  <body>
    <script>
      // Applies the dark theme before the first paint to avoid a white flash, keep it in sync with src/utils/theme.ts and src/i18n/detect.ts.
      try {
        var mode = localStorage.getItem('sayrud.theme')
        if (mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.body.setAttribute('arco-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        }
        var lang = localStorage.getItem('sayrud.lang')
        if (['en', 'zh-CN', 'zh-TW', 'ja', 'ko', 'es', 'pt-BR', 'fr', 'de', 'ru'].indexOf(lang) >= 0) {
          document.documentElement.lang = lang
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
