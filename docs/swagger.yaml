basePath: /_
definitions:
  AIAdvice:
    properties:
      action:
        enum:
        - tables
        type: string
      messages:
        items:
          $ref: '#/definitions/AIMessage'
        type: array
    required:
    - action
    - messages
    type: object
  AIAdviceResp:
    properties:
      action:
        type: string
      actionJson:
        description: ActionJSON is the structured payload of the action, which can
          be passed to the apply API as is.
        type: object
      description:
        type: string
      raw:
        description: Raw is the raw output of the model.
        type: string
    required:
    - action
    - actionJson
    - description
    - raw
    type: object
  AIApply:
    properties:
      action:
        enum:
        - tables
        type: string
      actionJson:
        description: ActionJson is the actionJson returned by the advice API.
        type: object
    required:
    - action
    - actionJson
    type: object
  AIMessage:
    properties:
      content:
        type: string
      role:
        type: string
    required:
    - content
    - role
    type: object
  Action:
    properties:
      action:
        description: Action is the type of the action.
        enum:
        - record.add
        - record.set
        - record.delete
        - field.add
        - field.set
        - field.setType
        - field.setShortcut
        - field.move
        - field.delete
        - view.add
        - view.set
        - view.move
        - view.delete
        - table.dirty
        type: string
      dirty:
        allOf:
        - $ref: '#/definitions/DirtyScope'
        description: Dirty is the data to reload for table.dirty.
      field:
        allOf:
        - $ref: '#/definitions/FieldAttrs'
        description: Field is the field properties for field.add / field.set / field.setType.
      fieldUID:
        description: FieldUID is generated by the client for field.add.
        type: string
      index:
        description: Index is the zero-based position for field.move / view.move,
          and the optional insert position for field.add / view.add.
        type: integer
      keepValues:
        description: KeepValues skips regenerating the existing cells when field.add
          / field.setShortcut sets a shortcut, e.g. duplicating a table.
        type: boolean
      recordUID:
        description: RecordUID is generated by the client for record.add.
        type: string
      recordUIDs:
        description: RecordUIDs are the records to delete for record.delete.
        items:
          type: string
        type: array
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut is the new shortcut for field.setShortcut, null removes
          the shortcut.
      values:
        additionalProperties: true
        description: Values are the cell values keyed by field UID for record.add
          / record.set, a null value clears the cell.
        type: object
      view:
        allOf:
        - $ref: '#/definitions/ViewAttrs'
        description: View is the view properties for view.add / view.set.
      viewUID:
        description: ViewUID is generated by the client for view.add.
        type: string
    required:
    - action
    type: object
  AddProjectMember:
    properties:
      email:
        type: string
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  AdminAISettings:
    properties:
      apiKeySet:
        description: APIKeySet reports whether an API key is saved and readable.
        type: boolean
      baseURL:
        description: BaseURL is the API root including the version, e.g. https://api.openai.com/v1.
        type: string
      enabled:
        description: Enabled reports whether the global AI model is enabled.
        type: boolean
      model:
        description: Model is the name of the model to call.
        type: string
      secretsReady:
        description: SecretsReady is false if auth.secret_key is not configured, the
          API key can not be saved.
        type: boolean
      timeoutSeconds:
        description: TimeoutSeconds is the timeout of a completion request.
        type: integer
    required:
    - apiKeySet
    - baseURL
    - enabled
    - model
    - secretsReady
    - timeoutSeconds
    type: object
  AdminAuthProvider:
    properties:
      acsURL:
        type: string
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      callbackURL:
        description: CallbackURL, ACSURL and MetadataURL are filled in at the identity
          provider, empty if the external URL is not set.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      createdAt:
        type: string
      enabled:
        type: boolean
      hasBindPassword:
        type: boolean
      hasClientSecret:
        description: HasClientSecret and HasBindPassword report whether the secrets
          have been saved.
        type: boolean
      icon:
        type: string
      id:
        type: integer
      identityCount:
        description: IdentityCount is the number of users bound to the sign-in method.
        type: integer
      linkByEmail:
        type: boolean
      metadataURL:
        type: string
      name:
        type: string
      position:
        type: integer
      slug:
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
      updatedAt:
        type: string
    required:
    - acsURL
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - callbackURL
    - config
    - createdAt
    - enabled
    - hasBindPassword
    - hasClientSecret
    - icon
    - id
    - identityCount
    - linkByEmail
    - metadataURL
    - name
    - position
    - slug
    - type
    - updatedAt
    type: object
  AdminCreateUser:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      userName:
        type: string
    required:
    - email
    - isAdmin
    - password
    - userName
    type: object
  AdminCredential:
    properties:
      hasValue:
        type: boolean
      key:
        type: string
      name:
        type: string
      type:
        enum:
        - bearer
        - header
        - query
        type: string
    required:
    - hasValue
    - key
    - type
    type: object
  AdminFieldShortcut:
    properties:
      aiEnabled:
        description: AIEnabled allows the script to call the globally configured AI
          model.
        type: boolean
      code:
        description: Code defines `async function execute(params, context)` returning
          the cell value, with context.ai.complete using the global model when AIEnabled.
        type: string
      createdAt:
        description: CreatedAt is the time the shortcut was created.
        type: string
      credentials:
        description: Credentials are the credentials the script can use when fetching.
        items:
          $ref: '#/definitions/AdminCredential'
        type: array
      description:
        description: Description tells the members what the shortcut does.
        type: string
      domains:
        description: Domains are the hosts the script can fetch, including their subdomains.
        items:
          type: string
        type: array
      enabled:
        description: Enabled reports whether the members can attach and execute the
          shortcut.
        type: boolean
      formItems:
        description: FormItems are the inputs configured in the field editor and passed
          to execute as the params.
        items:
          $ref: '#/definitions/ShortcutFormItem'
        type: array
      name:
        description: Name is shown in the field editor.
        type: string
      resultType:
        description: ResultType is the type of the fields the shortcut can be attached
          to.
        type: string
      timeoutSeconds:
        description: TimeoutSeconds is the time limit of an execution.
        type: integer
      uid:
        description: UID is the identifier the fields refer to the shortcut by.
        type: string
      updatedAt:
        description: UpdatedAt is the time the shortcut was last updated.
        type: string
      usedBy:
        description: UsedBy is the number of the fields using the shortcut.
        type: integer
    required:
    - aiEnabled
    - code
    - createdAt
    - credentials
    - description
    - domains
    - enabled
    - formItems
    - name
    - resultType
    - timeoutSeconds
    - uid
    - updatedAt
    - usedBy
    type: object
  AdminOverview:
    properties:
      activeSessions:
        type: integer
      projects:
        type: integer
      recentUsers:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
      records:
        type: integer
      system:
        $ref: '#/definitions/AdminSystemInfo'
      tables:
        type: integer
      users:
        $ref: '#/definitions/AdminUserStats'
    required:
    - activeSessions
    - projects
    - recentUsers
    - records
    - system
    - tables
    - users
    type: object
  AdminProject:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      memberCount:
        description: MemberCount is the number of collaborators, excluding the owner.
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      tableCount:
        type: integer
      uid:
        type: string
    required:
    - color
    - createdAt
    - icon
    - memberCount
    - name
    - owner
    - tableCount
    - uid
    type: object
  AdminResetPassword:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  AdminSetUserAdmin:
    properties:
      isAdmin:
        type: boolean
    required:
    - isAdmin
    type: object
  AdminSetUserStatus:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  AdminSystemInfo:
    properties:
      buildCommit:
        type: string
      goVersion:
        type: string
      settings:
        $ref: '#/definitions/SystemSettings'
    required:
    - buildCommit
    - goVersion
    - settings
    type: object
  AdminTransferProject:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  AdminUpdateUser:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  AdminUser:
    properties:
      avatarUrl:
        type: string
      color:
        type: string
      createdAt:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      lastSignInAt:
        type: string
      ownedProjectCount:
        type: integer
      providers:
        description: Providers are the sign-in methods bound by the user.
        items:
          $ref: '#/definitions/AuthProviderBrief'
        type: array
      userName:
        type: string
    required:
    - avatarUrl
    - color
    - createdAt
    - disabled
    - email
    - emailMd5
    - id
    - isAdmin
    - lastSignInAt
    - ownedProjectCount
    - providers
    - userName
    type: object
  AdminUserStats:
    properties:
      admins:
        type: integer
      disabled:
        type: integer
      newLast7Days:
        type: integer
      total:
        type: integer
    required:
    - admins
    - disabled
    - newLast7Days
    - total
    type: object
  Attachment:
    properties:
      contentType:
        type: string
      name:
        type: string
      size:
        type: integer
      uid:
        type: string
      url:
        type: string
    required:
    - contentType
    - name
    - size
    - uid
    - url
    type: object
  AuthProviderBrief:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - icon
    - name
    - slug
    type: object
  AuthProviderConfig:
    properties:
      allowIdPInitiated:
        type: boolean
      authURL:
        description: AuthURL, TokenURL and UserInfoURL are the authorization, token
          and user info URLs of OAuth 2.0.
        type: string
      baseDN:
        type: string
      bindDN:
        description: BindDN is the service account to search the users, it binds anonymously
          if empty.
        type: string
      clientID:
        description: ClientID and Scopes are used by OAuth 2.0 and OIDC.
        type: string
      emailAttribute:
        description: EmailAttribute, NameAttribute and GroupsAttribute are the attribute
          names of SAML or LDAP, the common SAML attributes are detected if empty.
        type: string
      emailPath:
        type: string
      emailsURL:
        description: EmailsURL returns [{email, primary, verified}], the primary and
          verified email in it takes precedence if set (GitHub, Gitea).
        type: string
      groupsAttribute:
        type: string
      groupsClaim:
        type: string
      groupsPath:
        type: string
      idpMetadataURL:
        description: IdPMetadataURL or IdPMetadataXML is the metadata of the SAML
          IdP, only one of them is set.
        type: string
      idpMetadataXML:
        type: string
      issuer:
        description: Issuer is the OIDC issuer for discovery.
        type: string
      nameAttribute:
        type: string
      nameClaim:
        type: string
      namePath:
        type: string
      rootCA:
        description: RootCA is the CA in PEM to verify the LDAP server certificate,
          the system CAs are used if empty.
        type: string
      scopes:
        items:
          type: string
        type: array
      spCertificate:
        description: SPCertificate is the generated SP certificate in PEM, the private
          key is in Secrets.
        type: string
      startTLS:
        type: boolean
      subjectAttribute:
        type: string
      subjectPath:
        description: SubjectPath, EmailPath, NamePath and GroupsPath are the dot paths
          in the user info JSON, e.g. data.user.email.
        type: string
      tokenURL:
        type: string
      trustEmail:
        description: TrustEmail treats the email from the IdP as verified, OIDC uses
          email_verified instead.
        type: boolean
      url:
        description: URL is the LDAP server address, ldap:// or ldaps://.
        type: string
      userFilter:
        description: The {username} in UserFilter is replaced with the escaped user
          name of the sign-in.
        type: string
      userInfoURL:
        type: string
    type: object
  BatchCreateRecords:
    properties:
      data:
        description: Data is the list of cell values keyed by field UID, one item
          for each record.
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - data
    type: object
  Changeset:
    properties:
      clientId:
        description: ClientID is the connection that submits the changeset, it is
          empty for the changesets generated by the server.
        type: string
      operations:
        items:
          $ref: '#/definitions/Operation'
        type: array
      rev:
        type: integer
      signature:
        description: Signature is generated by the submitting client to recognize
          its own changeset, it is empty for the changesets generated by the server.
        type: string
      tableUID:
        type: string
    required:
    - clientId
    - operations
    - rev
    - signature
    - tableUID
    type: object
  CreateAuthProvider:
    properties:
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      bindPassword:
        description: BindPassword is the password of the LDAP service account, empty
          keeps the saved one when updating.
        type: string
      clientSecret:
        description: ClientSecret is the client secret of OAuth 2.0 or OIDC, empty
          keeps the saved one when updating.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      enabled:
        type: boolean
      icon:
        type: string
      linkByEmail:
        type: boolean
      name:
        type: string
      slug:
        description: Slug is part of the callback URL and can not be changed after
          creating.
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - config
    - enabled
    - icon
    - linkByEmail
    - name
    - slug
    - type
    type: object
  CreateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
    required:
    - label
    - type
    type: object
  CreateFields:
    properties:
      fields:
        items:
          $ref: '#/definitions/CreateField'
        type: array
    required:
    - fields
    type: object
  CreateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
    type: object
  CreateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  DeleteAccount:
    properties:
      confirmEmail:
        description: ConfirmEmail is the own email entered by users without a password.
        type: string
      password:
        description: Password is the current password of users with one.
        type: string
    type: object
  DirtyScope:
    properties:
      allRecords:
        type: boolean
      fields:
        type: boolean
      records:
        items:
          type: string
        type: array
      views:
        type: boolean
    type: object
  FetchRecords:
    properties:
      uids:
        items:
          type: string
        type: array
    required:
    - uids
    type: object
  FieldAttrs:
    properties:
      label:
        description: Label is the title of the field.
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut is the optional shortcut of the new field for field.add.
      type:
        description: Type is the type of the field, the values are converted for field.setType.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
    type: object
  FieldShortcut:
    properties:
      autoUpdate:
        description: AutoUpdate regenerates the cell when any referenced field of
          the record changes.
        type: boolean
      id:
        description: ID is the UID of a custom shortcut.
        type: string
      inputs:
        additionalProperties: true
        description: |-
          Inputs are the configured values keyed by the form item key, a field_select item stores the field UID,
          and a prompt item stores the text referencing the fields by `{fieldUID}`.
        type: object
    required:
    - autoUpdate
    - id
    - inputs
    type: object
  FieldShortcutManifest:
    properties:
      aiEnabled:
        description: AIEnabled reports whether the script is allowed to use the globally
          configured AI model.
        type: boolean
      available:
        description: Available is false if the shortcut is disabled or its AI configuration
          is unavailable.
        type: boolean
      description:
        description: Description tells what the shortcut does.
        type: string
      formItems:
        description: FormItems are the inputs to configure in the field editor.
        items:
          $ref: '#/definitions/ShortcutFormItem'
        type: array
      id:
        description: ID is the UID of a custom shortcut.
        type: string
      kind:
        description: Kind is how the shortcut is executed, by a custom script.
        enum:
        - script
        type: string
      name:
        description: Name is shown in the field editor.
        type: string
      resultTypes:
        description: ResultTypes are the types of the fields the shortcut can be attached
          to.
        items:
          type: string
        type: array
    required:
    - aiEnabled
    - available
    - description
    - formItems
    - id
    - kind
    - name
    - resultTypes
    type: object
  LDAPSignIn:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  ListAdminAuthProvidersResp:
    properties:
      externalURL:
        type: string
      providers:
        items:
          $ref: '#/definitions/AdminAuthProvider'
        type: array
      secretsReady:
        description: SecretsReady reports whether auth.secret_key is configured.
        type: boolean
    required:
    - externalURL
    - providers
    - secretsReady
    type: object
  ListAdminFieldShortcutsResp:
    properties:
      shortcuts:
        items:
          $ref: '#/definitions/AdminFieldShortcut'
        type: array
      total:
        type: integer
    required:
    - shortcuts
    - total
    type: object
  ListAdminProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/AdminProject'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListAdminUsersResp:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
    required:
    - total
    - users
    type: object
  ListChangesetsResp:
    properties:
      changesets:
        items:
          $ref: '#/definitions/Changeset'
        type: array
      hasMore:
        description: HasMore reports there are more changesets after the last one,
          the client should fetch again from its revision.
        type: boolean
    required:
    - changesets
    - hasMore
    type: object
  ListProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/ProjectListItem'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListRecordsResp:
    properties:
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      total:
        description: Total is the number of records matching the query, regardless
          of limit and offset.
        type: integer
    required:
    - records
    - total
    type: object
  ListTablesResp:
    properties:
      tables:
        items:
          $ref: '#/definitions/TableListItem'
        type: array
      total:
        type: integer
    required:
    - tables
    - total
    type: object
  Operation:
    properties:
      actions:
        items:
          $ref: '#/definitions/Action'
        type: array
      command:
        type: string
    required:
    - actions
    - command
    type: object
  PreviewFieldShortcut:
    properties:
      fieldUID:
        description: FieldUID is the UID of the field being edited or created.
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the unsaved metadata of the field, e.g. the options
          of the select fields.
        type: object
      recordUIDs:
        description: RecordUIDs are the records to preview, at most 3.
        items:
          type: string
        type: array
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut is the unsaved shortcut config of the field.
      type:
        description: Type is the unsaved type of the field.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        type: string
    required:
    - fieldUID
    - recordUIDs
    - shortcut
    - type
    type: object
  Profile:
    properties:
      avatarUrl:
        type: string
      color:
        description: Color is the avatar color of the user.
        type: string
      createdAt:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      hasPassword:
        description: HasPassword reports whether the user has a password, the users
          created by third-party sign-in have none.
        type: boolean
      id:
        type: integer
      isAdmin:
        description: IsAdmin reports whether the user is a system admin.
        type: boolean
      userName:
        type: string
    required:
    - avatarUrl
    - color
    - createdAt
    - email
    - emailMd5
    - hasPassword
    - id
    - isAdmin
    - userName
    type: object
  Project:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - color
    - createdAt
    - icon
    - name
    - owner
    - role
    - uid
    - updatedAt
    type: object
  ProjectListItem:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      tableCount:
        type: integer
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - color
    - createdAt
    - icon
    - name
    - owner
    - role
    - tableCount
    - uid
    - updatedAt
    type: object
  ProjectMember:
    properties:
      role:
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      user:
        $ref: '#/definitions/UserBrief'
    required:
    - role
    - user
    type: object
  QueryRecords:
    properties:
      filter:
        items:
          $ref: '#/definitions/QueryRecordsFilter'
        type: array
      group:
        description: Group sorts the records by the field values before Order, so
          records in the same group are adjacent.
        items:
          $ref: '#/definitions/QueryRecordsGroup'
        type: array
      limit:
        description: Limit defaults to 20 when it is not positive.
        type: integer
      offset:
        type: integer
      order:
        items:
          $ref: '#/definitions/QueryRecordsSort'
        type: array
    type: object
  QueryRecordsFilter:
    properties:
      fieldUID:
        type: string
      operation:
        enum:
        - eq
        - neq
        - gt
        - lt
        - gte
        - lte
        - in
        - nin
        - like
        type: string
      value:
        description: Value is a JSON array (e.g. `["a","b"]`) for in / nin, and a
          single value for other operations.
        type: string
    required:
    - fieldUID
    - operation
    - value
    type: object
  QueryRecordsGroup:
    properties:
      fieldUID:
        type: string
    required:
    - fieldUID
    type: object
  QueryRecordsSort:
    properties:
      fieldUID:
        type: string
      order:
        enum:
        - asc
        - desc
        type: string
    required:
    - fieldUID
    type: object
  RunFieldShortcut:
    properties:
      recordUIDs:
        description: RecordUIDs are the records to generate if Scope is records.
        items:
          type: string
        type: array
      scope:
        description: Scope is all the records, the records whose cell is empty, or
          the given records.
        enum:
        - all
        - empty
        - records
        type: string
    required:
    - scope
    type: object
  RunFieldShortcutResp:
    properties:
      count:
        description: Count is the number of the cells queued.
        type: integer
    required:
    - count
    type: object
  SLField:
    properties:
      createdAt:
        description: CreatedAt is the time the field was created.
        type: string
      label:
        description: Label is the title of the field.
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      position:
        description: Position is the order of the field in the table, starting from
          0. The first field is the primary field.
        type: integer
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut generates the cell values from the other fields, it
          is absent if the values are edited by the users.
      tableUID:
        description: TableUID is the table of the field.
        type: string
      type:
        description: Type is the type of the field.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
      uid:
        description: UID is the identifier of the field, which is also the key of
          its values in the record data.
        type: string
      updatedAt:
        description: UpdatedAt is the time the field was last updated.
        type: string
    required:
    - createdAt
    - label
    - metadata
    - position
    - tableUID
    - type
    - uid
    - updatedAt
    type: object
  SLRecord:
    properties:
      createdAt:
        type: string
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
      tableUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - data
    - tableUID
    - uid
    - updatedAt
    type: object
  SLTable:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - color
    - createdAt
    - icon
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  SLView:
    properties:
      config:
        additionalProperties: true
        description: Config is maintained by the frontend, e.g. filter, sort, group,
          hidden fields and field widths.
        type: object
      name:
        type: string
      position:
        type: integer
      tableUID:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
      uid:
        type: string
    required:
    - config
    - name
    - position
    - tableUID
    - type
    - uid
    type: object
  SaveFieldShortcut:
    properties:
      aiEnabled:
        description: AIEnabled allows the script to call the globally configured AI
          model.
        type: boolean
      code:
        description: Code defines `async function execute(params, context)`, with
          context.ai.complete using the global model when AIEnabled.
        type: string
      credentials:
        description: Credentials are the credentials the script can use when fetching.
        items:
          $ref: '#/definitions/SaveShortcutCredential'
        type: array
      description:
        description: Description tells the members what the shortcut does, at most
          500 characters.
        type: string
      domains:
        description: Domains are the hosts the script can fetch, including their subdomains.
        items:
          type: string
        type: array
      enabled:
        description: Enabled reports whether the members can attach and execute the
          shortcut.
        type: boolean
      formItems:
        description: FormItems are the inputs configured in the field editor and passed
          to execute as the params.
        items:
          $ref: '#/definitions/ShortcutFormItem'
        type: array
      name:
        description: Name is shown in the field editor, at most 64 characters.
        type: string
      resultType:
        description: ResultType is the type of the fields the shortcut can be attached
          to.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        type: string
      timeoutSeconds:
        description: TimeoutSeconds is the time limit of an execution between 1 and
          300, 0 defaults to 30.
        type: integer
    required:
    - aiEnabled
    - code
    - credentials
    - description
    - domains
    - enabled
    - formItems
    - name
    - resultType
    - timeoutSeconds
    type: object
  SaveShortcutCredential:
    properties:
      key:
        description: Key is the identifier the script passes to context.fetch to use
          the credential.
        type: string
      name:
        description: Name is the header or query parameter name, it is ignored by
          bearer.
        type: string
      type:
        description: Type is how the credential is put into the request.
        enum:
        - bearer
        - header
        - query
        type: string
      value:
        description: Value replaces the saved value, empty keeps the saved one.
        type: string
    required:
    - key
    - type
    type: object
  SetAuthProviderPositions:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  ShortcutFormItem:
    properties:
      component:
        description: Component is the control to render the item.
        enum:
        - field_select
        - input
        - textarea
        - select
        - prompt
        type: string
      default:
        description: Default is the initial value when configuring a new field.
        type: string
      fieldTypes:
        description: FieldTypes limits the fields of field_select, empty allows all
          the fields except formulas.
        items:
          type: string
        type: array
      key:
        description: Key is the key of the configured value in FieldShortcut.Inputs
          and of the parameter passed to the shortcut.
        type: string
      label:
        description: Label is the name of the item shown in the form.
        type: string
      options:
        description: Options are the choices of select.
        items:
          $ref: '#/definitions/ShortcutFormOption'
        type: array
      placeholder:
        description: Placeholder is the hint of the empty input.
        type: string
      required:
        description: Required reports whether the item must be filled in before saving
          or executing.
        type: boolean
    required:
    - component
    - key
    - label
    type: object
  ShortcutFormOption:
    properties:
      label:
        description: Label is the text of the option shown in the form.
        type: string
      value:
        description: Value is the configured value of the option.
        type: string
    required:
    - label
    - value
    type: object
  ShortcutJob:
    properties:
      error:
        description: Error is the reason of the failure, or of the last attempt of
          a pending retry.
        type: string
      fieldUID:
        description: FieldUID is the field of the cell.
        type: string
      recordUID:
        description: RecordUID is the record of the cell.
        type: string
      status:
        description: Status is done when the job is removed, which is only sent over
          WebSocket.
        enum:
        - pending
        - running
        - failed
        - done
        type: string
    required:
    - fieldUID
    - recordUID
    - status
    type: object
  ShortcutPreview:
    properties:
      error:
        description: Error is the reason of the failure, empty if succeeded.
        type: string
      recordUID:
        description: RecordUID is the record previewed.
        type: string
      value:
        description: Value is the cell value of the field, null if empty or failed.
        type: object
    required:
    - recordUID
    type: object
  SignIn:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  SignUp:
    properties:
      email:
        type: string
      password:
        description: Password is limited to 64 characters since bcrypt only uses the
          first 72 bytes.
        type: string
      userName:
        type: string
    required:
    - email
    - password
    - userName
    type: object
  SiteAuthProvider:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - icon
    - name
    - slug
    - type
    type: object
  SiteInfo:
    properties:
      allowPasswordSignIn:
        description: AllowPasswordSignIn being false shows only the third-party sign-in
          on the sign-in page, admins can still use a password.
        type: boolean
      allowSignUp:
        type: boolean
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        type: integer
      providers:
        description: Providers are the enabled and usable sign-in methods in the order
          of the admin console.
        items:
          $ref: '#/definitions/SiteAuthProvider'
        type: array
      siteName:
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - loginNotice
    - passwordMinLength
    - providers
    - siteName
    type: object
  SystemSettings:
    properties:
      allowPasswordSignIn:
        description: AllowPasswordSignIn being false allows only the admins to sign
          in with email and password.
        type: boolean
      allowSignUp:
        description: AllowSignUp reports whether new users can sign up by themselves.
        type: boolean
      externalURL:
        description: ExternalURL is the address users visit (e.g. https://sayrud.example.com),
          the callback URLs of third-party sign-in are built on it, empty if not set.
        type: string
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        description: PasswordMinLength applies to signing up, changing, creating and
          resetting passwords.
        type: integer
      sessionTTLDays:
        description: SessionTTLDays is the lifetime in days of the new sessions.
        type: integer
      siteName:
        description: SiteName is shown in the page title and the sign-in page.
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - externalURL
    - loginNotice
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  TableListItem:
    properties:
      color:
        type: string
      count:
        type: integer
      createdAt:
        type: string
      icon:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - color
    - count
    - createdAt
    - icon
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  TableSnapshot:
    properties:
      fields:
        items:
          $ref: '#/definitions/SLField'
        type: array
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      rev:
        type: integer
      table:
        $ref: '#/definitions/SLTable'
      views:
        items:
          $ref: '#/definitions/SLView'
        type: array
    required:
    - fields
    - records
    - rev
    - table
    - views
    type: object
  TestAISettingsResp:
    properties:
      durationMs:
        description: DurationMs is the time of the request in milliseconds.
        type: integer
      reply:
        description: Reply is the content returned by the model, truncated to 500
          characters.
        type: string
    required:
    - durationMs
    - reply
    type: object
  TestAuthProvider:
    properties:
      bindPassword:
        description: BindPassword is the password of the LDAP service account.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      id:
        description: ID is the saved provider whose secrets are used if empty, 0 when
          creating.
        type: integer
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
      username:
        description: Username is the LDAP user to search, optional.
        type: string
    required:
    - config
    - type
    type: object
  TestFieldShortcut:
    properties:
      params:
        additionalProperties: true
        description: Params are passed to execute as is, keyed by the form item key.
        type: object
      shortcut:
        allOf:
        - $ref: '#/definitions/SaveFieldShortcut'
        description: Shortcut is the unsaved shortcut to run.
      uid:
        description: UID is the saved shortcut whose credential values are used if
          the values are not given.
        type: string
    required:
    - params
    - shortcut
    type: object
  TestFieldShortcutResp:
    properties:
      cellValue:
        description: CellValue is the value converted for a field of the result type,
          select fields are not converted as there are no options.
        type: object
      durationMs:
        description: DurationMs is the time of the run in milliseconds.
        type: integer
      error:
        description: Error is the reason of the failure, empty if succeeded.
        type: string
      logs:
        description: Logs are the lines printed by console and context.log, with the
          credential values redacted.
        items:
          type: string
        type: array
      value:
        description: Value is the value returned by execute, before converting to
          the cell value.
        type: object
    required:
    - durationMs
    - logs
    type: object
  TransferProjectOwner:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  UpdateAISettings:
    properties:
      apiKey:
        description: APIKey replaces the saved one, empty keeps the saved one.
        type: string
      baseURL:
        description: BaseURL is the API root including the version, e.g. https://api.openai.com/v1.
        type: string
      clearAPIKey:
        description: ClearAPIKey removes the saved API key, it is ignored if APIKey
          is given.
        type: boolean
      enabled:
        description: Enabled reports whether the global AI model is enabled.
        type: boolean
      model:
        description: Model is the name of the model to call, it is required if enabled.
        type: string
      timeoutSeconds:
        description: TimeoutSeconds is the timeout of a completion request, between
          1 and 120.
        type: integer
    required:
    - baseURL
    - enabled
    - model
    - timeoutSeconds
    type: object
  UpdateAuthProvider:
    properties:
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      bindPassword:
        description: BindPassword is the password of the LDAP service account, empty
          keeps the saved one when updating.
        type: string
      clientSecret:
        description: ClientSecret is the client secret of OAuth 2.0 or OIDC, empty
          keeps the saved one when updating.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      enabled:
        type: boolean
      icon:
        type: string
      linkByEmail:
        type: boolean
      name:
        type: string
    required:
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - config
    - enabled
    - icon
    - linkByEmail
    - name
    type: object
  UpdateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata replaces the whole field configuration, it is required
          when the type changes.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
    type: object
  UpdateFieldPosition:
    properties:
      position:
        description: Position is the zero-based index the field moves to, it is clamped
          into the valid range.
        type: integer
    required:
    - position
    type: object
  UpdatePassword:
    properties:
      newPassword:
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  UpdateProfile:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  UpdateProject:
    properties:
      color:
        description: Color is orange, coral, pink, purple, indigo, blue, teal or green;
          an empty string resets the color.
        type: string
      icon:
        description: Icon is a lowercase kebab-case identifier, an empty string resets
          the icon.
        maxLength: 64
        type: string
      name:
        type: string
    type: object
  UpdateProjectMember:
    properties:
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  UpdateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data replaces all the cell values of the record, keyed by field
          UID.
        type: object
    required:
    - data
    type: object
  UpdateSystemSettings:
    properties:
      allowPasswordSignIn:
        type: boolean
      allowSignUp:
        type: boolean
      externalURL:
        description: ExternalURL is the external URL of the site, empty if not set.
        type: string
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        type: integer
      sessionTTLDays:
        type: integer
      siteName:
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - externalURL
    - loginNotice
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  UpdateTable:
    properties:
      color:
        description: Color is orange, coral, pink, purple, indigo, blue, teal or green;
          an empty string resets the color.
        type: string
      icon:
        description: Icon is a lowercase kebab-case identifier, an empty string resets
          the icon.
        maxLength: 64
        type: string
      name:
        type: string
    type: object
  UpdateUserSettings:
    properties:
      language:
        enum:
        - en
        - zh-CN
        - zh-TW
        - ja
        - ko
        - es
        - pt-BR
        - fr
        - de
        - ru
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        type: string
    type: object
  UserBrief:
    properties:
      avatarUrl:
        type: string
      color:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      userName:
        type: string
    required:
    - avatarUrl
    - color
    - email
    - emailMd5
    - id
    - userName
    type: object
  UserIdentity:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      lastUsedAt:
        type: string
      providerIcon:
        type: string
      providerName:
        type: string
      providerSlug:
        type: string
      providerType:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - createdAt
    - email
    - id
    - lastUsedAt
    - providerIcon
    - providerName
    - providerSlug
    - providerType
    type: object
  UserSession:
    properties:
      createdAt:
        type: string
      current:
        description: Current reports whether it is the session of the current request.
        type: boolean
      expiresAt:
        type: string
      id:
        type: integer
      ip:
        type: string
      userAgent:
        type: string
    required:
    - createdAt
    - current
    - expiresAt
    - id
    - ip
    - userAgent
    type: object
  UserSettings:
    properties:
      language:
        description: Language is the language of the user interface.
        enum:
        - en
        - zh-CN
        - zh-TW
        - ja
        - ko
        - es
        - pt-BR
        - fr
        - de
        - ru
        type: string
      theme:
        description: Theme is the appearance of the user interface.
        enum:
        - light
        - dark
        - system
        type: string
    required:
    - language
    - theme
    type: object
  ViewAttrs:
    properties:
      config:
        additionalProperties: true
        type: object
      name:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
    type: object
info:
  contact: {}
  title: Sayrud API
  version: "1.0"
paths:
  /admin/ai:
    get:
      description: Requires the admin. The API key is not returned.
      operationId: getAdminAISettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAISettings'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the AI model settings
    put:
      consumes:
      - application/json
      description: Requires the admin. The API key is encrypted by auth.secret_key,
        empty keeps the saved one. It updates the global AI model configuration immediately.
      operationId: updateAdminAISettings
      parameters:
      - description: AI model settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAISettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAISettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the AI model settings
  /admin/ai/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. Send a short message to the unsaved model,
        the saved API key is used if it is not given.
      operationId: testAdminAISettings
      parameters:
      - description: AI model settings to test
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAISettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestAISettingsResp'
        "400":
          description: Invalid settings or the request failed
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test the AI model settings
  /admin/auth-providers:
    get:
      description: Requires the admin. The secrets are not returned.
      operationId: listAdminAuthProviders
      produces:
      - application/json
      responses:
        "200":
