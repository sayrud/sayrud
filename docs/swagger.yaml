      operationId: ssoCallback
      parameters:
      - description: Provider slug
        in: path
        name: slug
        required: true
        type: string
      - description: State
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        type: string
      responses:
        "302":
          description: Redirect after signing in
      summary: OAuth 2.0 / OIDC callback
