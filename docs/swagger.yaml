      operationId: deleteAdminUser
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User ID to receive the owned projects
        in: query
        name: transferTo
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a user
    put:
      consumes:
      - application/json
      description: Requires the admin.
      operationId: updateAdminUser
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User name
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminUpdateUser'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the user name of a user
  /admin/users/{userID}/admin:
    put:
      consumes:
      - application/json
      description: Requires the admin. The admin can not revoke itself, and at least
        one enabled admin is kept.
      operationId: setAdminUserAdmin
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Whether the user is an admin
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminSetUserAdmin'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Grant or revoke the admin
  /admin/users/{userID}/password:
    put:
      consumes:
      - application/json
      description: Requires the admin. The user is signed out everywhere.
      operationId: resetAdminUserPassword
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: New password
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminResetPassword'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Reset the password of a user
  /admin/users/{userID}/sessions:
    delete:
      description: Requires the admin. Use the account settings for the admin itself.
      operationId: revokeAdminUserSessions
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Sign out a user everywhere
  /admin/users/{userID}/status:
    put:
      consumes:
      - application/json
      description: Requires the admin. Disabling signs the user out everywhere. The
        admin can not disable itself, and at least one enabled admin is kept.
      operationId: setAdminUserStatus
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Whether the user is disabled
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminSetUserStatus'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Disable or enable a user
  /admin/workflow-plugins:
    get:
      description: Requires the admin. The built-in nodes are listed too, their texts
        are frontend i18n keys.
      operationId: listAdminWorkflowPlugins
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListWorkflowPluginsResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the workflow node plugins
    post:
      consumes:
      - application/json
      description: Requires the admin. A plugin with the same manifest id is replaced
        and keeps its enabled state; the workflows use the new version right away.
      operationId: installAdminWorkflowPlugin
      parameters:
      - description: Source
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/InstallWorkflowPlugin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorkflowPlugin'
        "400":
          description: Invalid plugin
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Install or upgrade a workflow node plugin
  /admin/workflow-plugins/{pluginID}:
    delete:
      description: Requires the admin. The workflows using the node keep their steps,
        which fail until the plugin is installed again.
      operationId: uninstallAdminWorkflowPlugin
      parameters:
      - description: Plugin ID
        in: path
        name: pluginID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Plugin not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
