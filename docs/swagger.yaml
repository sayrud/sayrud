            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the state of an import
  /projects/{projectUID}/imports/{importUID}/start:
    post:
      consumes:
      - application/json
      description: Import a sheet of the uploaded file in the background, into the
        table or a new table. The fields, options and records are written in a single
        transaction, so a failed import changes nothing. Poll the import for the progress.
      operationId: startImport
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Import UID
        in: path
        name: importUID
        required: true
        type: string
      - description: Sheet and column mapping
        in: body
        name: data
        required: true
        schema:
