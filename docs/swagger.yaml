      consumes:
      - application/json
      description: Requires the admin. It works even if signing up is disabled.
      operationId: createAdminUser
      parameters:
      - description: User to create
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminCreateUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUser'
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "409":
          description: Email has been used
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a user
  /admin/users/{userID}:
    delete:
      description: Requires the admin. The projects owned by the user are transferred
