        schema:
          $ref: '#/definitions/UpdateUserSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserSettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
