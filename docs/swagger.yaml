      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Whether the user is an admin
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminSetUserAdmin'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Grant or revoke the admin
  /admin/users/{userID}/password:
    put:
      consumes:
      - application/json
      description: Requires the admin. The user is signed out everywhere.
      operationId: resetAdminUserPassword
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: New password
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminResetPassword'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Reset the password of a user
