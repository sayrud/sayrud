        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a workflow
    get:
      description: Return the workflow with its draft and the issues to fix before
        publishing.
      operationId: getWorkflow
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Workflow'
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a workflow
    put:
      consumes:
      - application/json
      description: Save the draft based on draftVersion, it responds 409 if others
        saved the draft since. The settings unrelated to the trigger are dropped.
      operationId: saveWorkflowDraft
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
        required: true
        type: string
      - description: Draft
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SaveWorkflowDraft'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SaveWorkflowDraftResp'
        "400":
          description: Draft too large
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "409":
          description: Draft saved by others
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Save the draft of a workflow
  /projects/{projectUID}/workflows/{workflowUID}/debug:
    post:
      consumes:
      - application/json
      description: |-
        Run the draft. The API trigger runs with the request; the other triggers run with the record (the latest one if not specified) or the current time.
        dry_run rolls back the writes and skips the asynchronous flows and external actions, live runs them for real and is recorded as a debug run.
      operationId: debugWorkflow
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
        required: true
        type: string
      - description: Request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/DebugWorkflow'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DebugWorkflowResp'
        "400":
          description: Invalid request body or no record to debug with
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Debug a workflow
  /projects/{projectUID}/workflows/{workflowUID}/enabled:
