  /projects/{projectUID}/imports:
    post:
      consumes:
      - multipart/form-data
      description: Upload an Excel (.xlsx) or CSV file up to 20 MiB. The response
        previews the visible sheets with the inferred column types; the file is kept
        for 24 hours to start the import.
      operationId: uploadImport
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Excel or CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImportUpload'
        "400":
          description: Unsupported, empty or invalid file
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "413":
          description: File is too large
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
