basePath: /_
definitions:
  AIAdvice:
    properties:
      action:
        enum:
        - tables
        type: string
      messages:
        items:
          $ref: '#/definitions/AIMessage'
        type: array
    required:
    - action
    - messages
    type: object
  AIAdviceResp:
    properties:
      action:
        type: string
      actionJson:
        description: ActionJSON is the structured payload of the action, which can
          be passed to the apply API as is.
        type: object
      description:
        type: string
      raw:
        description: Raw is the raw output of the model.
        type: string
    required:
    - action
    - actionJson
    - description
    - raw
    type: object
  AIApply:
    properties:
      action:
        enum:
        - tables
        type: string
      actionJson:
        description: ActionJson is the actionJson returned by the advice API.
        type: object
    required:
    - action
    - actionJson
    type: object
  AIMessage:
    properties:
      content:
        type: string
      role:
        type: string
    required:
    - content
    - role
    type: object
  Action:
    properties:
      action:
        enum:
        - record.add
        - record.set
        - record.delete
        - field.add
        - field.set
        - field.setType
        - field.move
        - field.delete
        - view.add
        - view.set
        - view.move
        - view.delete
        - table.dirty
        type: string
      dirty:
        $ref: '#/definitions/DirtyScope'
      field:
        $ref: '#/definitions/FieldAttrs'
      fieldUID:
        description: FieldUID is generated by the client for field.add.
        type: string
      index:
        description: Index is the zero-based position for field.move / view.move,
          and the optional insert position for field.add / view.add.
        type: integer
      recordUID:
        description: RecordUID is generated by the client for record.add.
        type: string
      recordUIDs:
        items:
          type: string
        type: array
      values:
        additionalProperties: true
        description: Values are the cell values keyed by field UID for record.add
          / record.set, a null value clears the cell.
        type: object
      view:
        $ref: '#/definitions/ViewAttrs'
      viewUID:
        description: ViewUID is generated by the client for view.add.
        type: string
    required:
    - action
    type: object
  AddProjectMember:
    properties:
      email:
        type: string
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  AdminAuthProvider:
    properties:
      acsURL:
        type: string
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      callbackURL:
        description: CallbackURL, ACSURL and MetadataURL are filled in at the identity
          provider, empty if the external URL is not set.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      createdAt:
        type: string
      enabled:
        type: boolean
      hasBindPassword:
        type: boolean
      hasClientSecret:
        description: HasClientSecret and HasBindPassword report whether the secrets
          have been saved.
        type: boolean
      icon:
        type: string
      id:
        type: integer
      identityCount:
        description: IdentityCount is the number of users bound to the sign-in method.
        type: integer
      linkByEmail:
        type: boolean
      metadataURL:
        type: string
      name:
        type: string
      position:
        type: integer
      slug:
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
      updatedAt:
        type: string
    required:
    - acsURL
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - callbackURL
    - config
    - createdAt
    - enabled
    - hasBindPassword
    - hasClientSecret
    - icon
    - id
    - identityCount
    - linkByEmail
    - metadataURL
    - name
    - position
    - slug
    - type
    - updatedAt
    type: object
  AdminCreateUser:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      userName:
        type: string
    required:
    - email
    - isAdmin
    - password
    - userName
    type: object
  AdminOverview:
    properties:
      activeSessions:
        type: integer
      projects:
        type: integer
      recentUsers:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
      records:
        type: integer
      system:
        $ref: '#/definitions/AdminSystemInfo'
      tables:
        type: integer
      users:
        $ref: '#/definitions/AdminUserStats'
    required:
    - activeSessions
    - projects
    - recentUsers
    - records
    - system
    - tables
    - users
    type: object
  AdminProject:
    properties:
      createdAt:
        type: string
      memberCount:
        description: MemberCount is the number of collaborators, excluding the owner.
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      tableCount:
        type: integer
      uid:
        type: string
    required:
    - createdAt
    - memberCount
    - name
    - owner
    - tableCount
    - uid
    type: object
  AdminResetPassword:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  AdminSetUserAdmin:
    properties:
      isAdmin:
        type: boolean
    required:
    - isAdmin
    type: object
  AdminSetUserStatus:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  AdminSystemInfo:
    properties:
      buildCommit:
        type: string
      goVersion:
        type: string
      settings:
        $ref: '#/definitions/SystemSettings'
    required:
    - buildCommit
    - goVersion
    - settings
    type: object
  AdminTransferProject:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  AdminUpdateUser:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  AdminUser:
    properties:
      color:
        type: string
      createdAt:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      lastSignInAt:
        type: string
      ownedProjectCount:
        type: integer
      providers:
        description: Providers are the sign-in methods bound by the user.
        items:
          $ref: '#/definitions/AuthProviderBrief'
        type: array
      userName:
        type: string
    required:
    - color
    - createdAt
    - disabled
    - email
    - emailMd5
    - id
    - isAdmin
    - lastSignInAt
    - ownedProjectCount
    - providers
    - userName
    type: object
  AdminUserStats:
    properties:
      admins:
        type: integer
      disabled:
        type: integer
      newLast7Days:
        type: integer
      total:
        type: integer
    required:
    - admins
    - disabled
    - newLast7Days
    - total
    type: object
  AuthProviderBrief:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - icon
    - name
    - slug
    type: object
  AuthProviderConfig:
    properties:
      allowIdPInitiated:
        type: boolean
      authURL:
        description: AuthURL, TokenURL and UserInfoURL are the authorization, token
          and user info URLs of OAuth 2.0.
        type: string
      baseDN:
        type: string
      bindDN:
        description: BindDN is the service account to search the users, it binds anonymously
          if empty.
        type: string
      clientID:
        description: ClientID and Scopes are used by OAuth 2.0 and OIDC.
        type: string
      emailAttribute:
        description: EmailAttribute, NameAttribute and GroupsAttribute are the attribute
          names of SAML or LDAP, the common SAML attributes are detected if empty.
        type: string
      emailPath:
        type: string
      emailsURL:
        description: EmailsURL returns [{email, primary, verified}], the primary and
          verified email in it takes precedence if set (GitHub, Gitea).
        type: string
      groupsAttribute:
        type: string
      groupsClaim:
        type: string
      groupsPath:
        type: string
      idpMetadataURL:
        description: IdPMetadataURL or IdPMetadataXML is the metadata of the SAML
          IdP, only one of them is set.
        type: string
      idpMetadataXML:
        type: string
      issuer:
        description: Issuer is the OIDC issuer for discovery.
        type: string
      nameAttribute:
        type: string
      nameClaim:
        type: string
      namePath:
        type: string
      rootCA:
        description: RootCA is the CA in PEM to verify the LDAP server certificate,
          the system CAs are used if empty.
        type: string
      scopes:
        items:
          type: string
        type: array
      spCertificate:
        description: SPCertificate is the generated SP certificate in PEM, the private
          key is in Secrets.
        type: string
      startTLS:
        type: boolean
      subjectAttribute:
        type: string
      subjectPath:
        description: SubjectPath, EmailPath, NamePath and GroupsPath are the dot paths
          in the user info JSON, e.g. data.user.email.
        type: string
      tokenURL:
        type: string
      trustEmail:
        description: TrustEmail treats the email from the IdP as verified, OIDC uses
          email_verified instead.
        type: boolean
      url:
        description: URL is the LDAP server address, ldap:// or ldaps://.
        type: string
      userFilter:
        description: The {username} in UserFilter is replaced with the escaped user
          name of the sign-in.
        type: string
      userInfoURL:
        type: string
    type: object
  BatchCreateRecords:
    properties:
      data:
        description: Data is the list of cell values keyed by field UID, one item
          for each record.
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - data
    type: object
  Changeset:
    properties:
      clientId:
        description: ClientID is the connection that submits the changeset, it is
          empty for the changesets generated by the server.
        type: string
      operations:
        items:
          $ref: '#/definitions/Operation'
        type: array
      rev:
        type: integer
      signature:
        description: Signature is generated by the submitting client to recognize
          its own changeset, it is empty for the changesets generated by the server.
        type: string
      tableUID:
        type: string
    required:
    - clientId
    - operations
    - rev
    - signature
    - tableUID
    type: object
  CreateAuthProvider:
    properties:
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      bindPassword:
        description: BindPassword is the password of the LDAP service account, empty
          keeps the saved one when updating.
        type: string
      clientSecret:
        description: ClientSecret is the client secret of OAuth 2.0 or OIDC, empty
          keeps the saved one when updating.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      enabled:
        type: boolean
      icon:
        type: string
      linkByEmail:
        type: boolean
      name:
        type: string
      slug:
        description: Slug is part of the callback URL and can not be changed after
          creating.
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - config
    - enabled
    - icon
    - linkByEmail
    - name
    - slug
    - type
    type: object
  CreateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    required:
    - label
    - type
    type: object
  CreateFields:
    properties:
      fields:
        items:
          $ref: '#/definitions/CreateField'
        type: array
    required:
    - fields
    type: object
  CreateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
    type: object
  CreateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  DeleteAccount:
    properties:
      confirmEmail:
        description: ConfirmEmail is the own email entered by users without a password.
        type: string
      password:
        description: Password is the current password of users with one.
        type: string
    type: object
  DirtyScope:
    properties:
      allRecords:
        type: boolean
      fields:
        type: boolean
      records:
        items:
          type: string
        type: array
      views:
        type: boolean
    type: object
  FetchRecords:
    properties:
      uids:
        items:
          type: string
        type: array
    required:
    - uids
    type: object
  FieldAttrs:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    type: object
  LDAPSignIn:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  ListAdminAuthProvidersResp:
    properties:
      externalURL:
        type: string
      providers:
        items:
          $ref: '#/definitions/AdminAuthProvider'
        type: array
      secretsReady:
        description: SecretsReady reports whether auth.secret_key is configured.
        type: boolean
    required:
    - externalURL
    - providers
    - secretsReady
    type: object
  ListAdminProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/AdminProject'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListAdminUsersResp:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
    required:
    - total
    - users
    type: object
  ListChangesetsResp:
    properties:
      changesets:
        items:
          $ref: '#/definitions/Changeset'
        type: array
      hasMore:
        description: HasMore reports there are more changesets after the last one,
          the client should fetch again from its revision.
        type: boolean
    required:
    - changesets
    - hasMore
    type: object
  ListProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/ProjectListItem'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListRecordsResp:
    properties:
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      total:
        description: Total is the number of records matching the query, regardless
          of limit and offset.
        type: integer
    required:
    - records
    - total
    type: object
  ListTablesResp:
    properties:
      tables:
        items:
          $ref: '#/definitions/TableListItem'
        type: array
      total:
        type: integer
    required:
    - tables
    - total
    type: object
  Operation:
    properties:
      actions:
        items:
          $ref: '#/definitions/Action'
        type: array
      command:
        type: string
    required:
    - actions
    - command
    type: object
  Profile:
    properties:
      color:
        description: Color is the avatar color of the user.
        type: string
      createdAt:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      hasPassword:
        description: HasPassword reports whether the user has a password, the users
          created by third-party sign-in have none.
        type: boolean
      id:
        type: integer
      isAdmin:
        description: IsAdmin reports whether the user is a system admin.
        type: boolean
      userName:
        type: string
    required:
    - color
    - createdAt
    - email
    - emailMd5
    - hasPassword
    - id
    - isAdmin
    - userName
    type: object
  Project:
    properties:
      createdAt:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - owner
    - role
    - uid
    - updatedAt
    type: object
  ProjectListItem:
    properties:
      createdAt:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      tableCount:
        type: integer
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - owner
    - role
    - tableCount
    - uid
    - updatedAt
    type: object
  ProjectMember:
    properties:
      role:
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      user:
        $ref: '#/definitions/UserBrief'
    required:
    - role
    - user
    type: object
  QueryRecords:
    properties:
      filter:
        items:
          $ref: '#/definitions/QueryRecordsFilter'
        type: array
      group:
        description: Group sorts the records by the field values before Order, so
          records in the same group are adjacent.
        items:
          $ref: '#/definitions/QueryRecordsGroup'
        type: array
      limit:
        description: Limit defaults to 20 when it is not positive.
        type: integer
      offset:
        type: integer
      order:
        items:
          $ref: '#/definitions/QueryRecordsSort'
        type: array
    type: object
  QueryRecordsFilter:
    properties:
      fieldUID:
        type: string
      operation:
        enum:
        - eq
        - neq
        - gt
        - lt
        - gte
        - lte
        - in
        - nin
        - like
        type: string
      value:
        description: Value is a JSON array (e.g. `["a","b"]`) for in / nin, and a
          single value for other operations.
        type: string
    required:
    - fieldUID
    - operation
    - value
    type: object
  QueryRecordsGroup:
    properties:
      fieldUID:
        type: string
    required:
    - fieldUID
    type: object
  QueryRecordsSort:
    properties:
      fieldUID:
        type: string
      order:
        enum:
        - asc
        - desc
        type: string
    required:
    - fieldUID
    type: object
  SLField:
    properties:
      createdAt:
        type: string
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      position:
        type: integer
      tableUID:
        type: string
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - label
    - metadata
    - position
    - tableUID
    - type
    - uid
    - updatedAt
    type: object
  SLRecord:
    properties:
      createdAt:
        type: string
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
      tableUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - data
    - tableUID
    - uid
    - updatedAt
    type: object
  SLTable:
    properties:
      createdAt:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  SLView:
    properties:
      config:
        additionalProperties: true
        description: Config is maintained by the frontend, e.g. filter, sort, group,
          hidden fields and field widths.
        type: object
      name:
        type: string
      position:
        type: integer
      tableUID:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
      uid:
        type: string
    required:
    - config
    - name
    - position
    - tableUID
    - type
    - uid
    type: object
  SetAuthProviderPositions:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  SignIn:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  SignUp:
    properties:
      email:
        type: string
      password:
        description: Password is limited to 64 characters since bcrypt only uses the
          first 72 bytes.
        type: string
      userName:
        type: string
    required:
    - email
    - password
    - userName
    type: object
  SiteAuthProvider:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - icon
    - name
    - slug
    - type
    type: object
  SiteInfo:
    properties:
      allowPasswordSignIn:
        description: AllowPasswordSignIn being false shows only the third-party sign-in
          on the sign-in page, admins can still use a password.
        type: boolean
      allowSignUp:
        type: boolean
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        type: integer
      providers:
        description: Providers are the enabled and usable sign-in methods in the order
          of the admin console.
        items:
          $ref: '#/definitions/SiteAuthProvider'
        type: array
      siteName:
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - loginNotice
    - passwordMinLength
    - providers
    - siteName
    type: object
  SystemSettings:
    properties:
      allowPasswordSignIn:
        description: AllowPasswordSignIn being false allows only the admins to sign
          in with email and password.
        type: boolean
      allowSignUp:
        description: AllowSignUp reports whether new users can sign up by themselves.
        type: boolean
      externalURL:
        description: ExternalURL is the address users visit (e.g. https://sayrud.example.com),
          the callback URLs of third-party sign-in are built on it, empty if not set.
        type: string
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        description: PasswordMinLength applies to signing up, changing, creating and
          resetting passwords.
        type: integer
      sessionTTLDays:
        description: SessionTTLDays is the lifetime in days of the new sessions.
        type: integer
      siteName:
        description: SiteName is shown in the page title and the sign-in page.
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - externalURL
    - loginNotice
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  TableListItem:
    properties:
      count:
        type: integer
      createdAt:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - count
    - createdAt
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  TableSnapshot:
    properties:
      fields:
        items:
          $ref: '#/definitions/SLField'
        type: array
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      rev:
        type: integer
      table:
        $ref: '#/definitions/SLTable'
      views:
        items:
          $ref: '#/definitions/SLView'
        type: array
    required:
    - fields
    - records
    - rev
    - table
    - views
    type: object
  TestAuthProvider:
    properties:
      bindPassword:
        description: BindPassword is the password of the LDAP service account.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      id:
        description: ID is the saved provider whose secrets are used if empty, 0 when
          creating.
        type: integer
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
      username:
        description: Username is the LDAP user to search, optional.
        type: string
    required:
    - config
    - type
    type: object
  TransferProjectOwner:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  UpdateAuthProvider:
    properties:
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      bindPassword:
        description: BindPassword is the password of the LDAP service account, empty
          keeps the saved one when updating.
        type: string
      clientSecret:
        description: ClientSecret is the client secret of OAuth 2.0 or OIDC, empty
          keeps the saved one when updating.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      enabled:
        type: boolean
      icon:
        type: string
      linkByEmail:
        type: boolean
      name:
        type: string
    required:
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - config
    - enabled
    - icon
    - linkByEmail
    - name
    type: object
  UpdateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata replaces the whole field configuration, it is required
          when the type changes.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    type: object
  UpdateFieldPosition:
    properties:
      position:
        description: Position is the zero-based index the field moves to, it is clamped
          into the valid range.
        type: integer
    required:
    - position
    type: object
  UpdatePassword:
    properties:
      newPassword:
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  UpdateProfile:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  UpdateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  UpdateProjectMember:
    properties:
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  UpdateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data replaces all the cell values of the record, keyed by field
          UID.
        type: object
    required:
    - data
    type: object
  UpdateSystemSettings:
    properties:
      allowPasswordSignIn:
        type: boolean
      allowSignUp:
        type: boolean
      externalURL:
        description: ExternalURL is the external URL of the site, empty if not set.
        type: string
      loginNotice:
        description: LoginNotice is the plain text shown above the sign-in form, empty
          if hidden.
        type: string
      passwordMinLength:
        type: integer
      sessionTTLDays:
        type: integer
      siteName:
        type: string
    required:
    - allowPasswordSignIn
    - allowSignUp
    - externalURL
    - loginNotice
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  UpdateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  UpdateUserSettings:
    properties:
      language:
        enum:
        - en
        - zh-CN
        - zh-TW
        - ja
        - ko
        - es
        - pt-BR
        - fr
        - de
        - ru
        type: string
      theme:
        enum:
        - light
        - dark
        - system
        type: string
    type: object
  UserBrief:
    properties:
      color:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      userName:
        type: string
    required:
    - color
    - email
    - emailMd5
    - id
    - userName
    type: object
  UserIdentity:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      lastUsedAt:
        type: string
      providerIcon:
        type: string
      providerName:
        type: string
      providerSlug:
        type: string
      providerType:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - createdAt
    - email
    - id
    - lastUsedAt
    - providerIcon
    - providerName
    - providerSlug
    - providerType
    type: object
  UserSession:
    properties:
      createdAt:
        type: string
      current:
        description: Current reports whether it is the session of the current request.
        type: boolean
      expiresAt:
        type: string
      id:
        type: integer
      ip:
        type: string
      userAgent:
        type: string
    required:
    - createdAt
    - current
    - expiresAt
    - id
    - ip
    - userAgent
    type: object
  UserSettings:
    properties:
      language:
        description: Language is the language of the user interface.
        enum:
        - en
        - zh-CN
        - zh-TW
        - ja
        - ko
        - es
        - pt-BR
        - fr
        - de
        - ru
        type: string
      theme:
        description: Theme is the appearance of the user interface.
        enum:
        - light
        - dark
        - system
        type: string
    required:
    - language
    - theme
    type: object
  ViewAttrs:
    properties:
      config:
        additionalProperties: true
        type: object
      name:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
    type: object
info:
  contact: {}
  title: Sayrud API
  version: "1.0"
paths:
  /admin/auth-providers:
    get:
      description: Requires the admin. The secrets are not returned.
      operationId: listAdminAuthProviders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminAuthProvidersResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the sign-in methods
    post:
      consumes:
      - application/json
      description: Requires the admin and auth.secret_key in the config file. The
        SAML service provider certificate is generated automatically.
      operationId: createAdminAuthProvider
      parameters:
      - description: Sign-in method
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CreateAuthProvider'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAuthProvider'
        "400":
          description: Invalid config
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "409":
          description: The slug has been used
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a sign-in method
  /admin/auth-providers/{providerID}:
    delete:
      description: Requires the admin. The bound third-party accounts of the users
        are unbound.
      operationId: deleteAdminAuthProvider
      parameters:
      - description: Provider ID
        in: path
        name: providerID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Provider not found
          schema:
            type: string
        "409":
          description: It is the last enabled sign-in method while password sign-in
            is disabled
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a sign-in method
    put:
      consumes:
      - application/json
      description: Requires the admin. The slug and the type can not be changed, the
        empty secrets keep the saved ones.
      operationId: updateAdminAuthProvider
      parameters:
      - description: Provider ID
        in: path
        name: providerID
        required: true
        type: integer
      - description: Sign-in method
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAuthProvider'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAuthProvider'
        "400":
          description: Invalid config
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Provider not found
          schema:
            type: string
        "409":
          description: It is the last enabled sign-in method while password sign-in
            is disabled
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update a sign-in method
  /admin/auth-providers/positions:
    put:
      consumes:
      - application/json
      description: Requires the admin. The sign-in page shows them in this order.
      operationId: setAdminAuthProviderPositions
      parameters:
      - description: Provider IDs in order
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SetAuthProviderPositions'
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Reorder the sign-in methods
  /admin/auth-providers/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. OIDC fetches the discovery document, SAML loads
        the IdP metadata, LDAP binds the service account and optionally searches the
        user. OAuth 2.0 is not supported.
      operationId: testAdminAuthProvider
      parameters:
      - description: Config to test
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/TestAuthProvider'
      responses:
        "204":
          description: No Content
        "400":
          description: The connection failed or the type is not supported
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test the connection of a sign-in method
  /admin/overview:
    get:
      description: Requires the admin.
      operationId: getAdminOverview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminOverview'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the overview of the system
  /admin/projects:
    get:
      description: Requires the admin. The newest projects come first.
      operationId: listAdminProjects
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the project name
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminProjectsResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List all the projects
  /admin/projects/{projectUID}:
    delete:
      description: Requires the admin.
      operationId: deleteAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a project
  /admin/projects/{projectUID}/owner:
    put:
      consumes:
      - application/json
      description: Requires the admin. The new owner can be any enabled user, the
        previous owner becomes a manager.
      operationId: transferAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: New owner
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminTransferProject'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid new owner
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Transfer the ownership of a project
  /admin/settings:
    get:
      description: Requires the admin.
      operationId: getSystemSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the system settings
    put:
      consumes:
      - application/json
      description: Requires the admin. The password and session settings apply to
        the later sign-ups and sign-ins.
      operationId: updateSystemSettings
      parameters:
      - description: System settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateSystemSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the system settings
  /admin/users:
    get:
      description: Requires the admin. The newest users come first.
      operationId: listAdminUsers
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the user name or email
        in: query
        name: keyword
        type: string
      - description: Filter by status, all if empty
        enum:
        - active
        - disabled
        - admin
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminUsersResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the users
    post:
      consumes:
      - application/json
      description: Requires the admin. It works even if signing up is disabled.
      operationId: createAdminUser
      parameters:
      - description: User to create
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminCreateUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminUser'
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "409":
          description: Email has been used
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a user
  /admin/users/{userID}:
    delete:
      description: Requires the admin. The projects owned by the user are transferred
        to transferTo, which is required if there are any.
      operationId: deleteAdminUser
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User ID to receive the owned projects
        in: query
        name: transferTo
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a user
    put:
      consumes:
      - application/json
      description: Requires the admin.
      operationId: updateAdminUser
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: User name
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminUpdateUser'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the user name of a user
  /admin/users/{userID}/admin:
    put:
      consumes:
      - application/json
      description: Requires the admin. The admin can not revoke itself, and at least
        one enabled admin is kept.
      operationId: setAdminUserAdmin
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Whether the user is an admin
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminSetUserAdmin'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Grant or revoke the admin
  /admin/users/{userID}/password:
    put:
      consumes:
      - application/json
      description: Requires the admin. The user is signed out everywhere.
      operationId: resetAdminUserPassword
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: New password
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminResetPassword'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Reset the password of a user
  /admin/users/{userID}/sessions:
    delete:
      description: Requires the admin. Use the account settings for the admin itself.
      operationId: revokeAdminUserSessions
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Sign out a user everywhere
  /admin/users/{userID}/status:
    put:
      consumes:
      - application/json
      description: Requires the admin. Disabling signs the user out everywhere. The
        admin can not disable itself, and at least one enabled admin is kept.
      operationId: setAdminUserStatus
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      - description: Whether the user is disabled
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminSetUserStatus'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Disable or enable a user
  /auth/account:
    delete:
      consumes:
      - application/json
      description: The projects owned by the user must be deleted or transferred first,
        and the last admin can not be deleted. Users without a password confirm with
        their email instead.
      operationId: deleteAccount
      parameters:
      - description: Password or email confirmation
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/DeleteAccount'
      responses:
        "204":
          description: No Content
        "400":
          description: Wrong password or email
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "409":
          description: The user still owns projects or is the last admin
          schema:
            type: string
        "429":
          description: Too many attempts
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete the account of the signed-in user
  /auth/identities:
    get:
      operationId: listIdentities
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/UserIdentity'
            type: array
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the third-party accounts bound to the signed-in user
  /auth/identities/{identityID}:
    delete:
      description: The last way to sign in can not be unbound if the user has no password.
      operationId: deleteIdentity
      parameters:
      - description: Identity ID
        in: path
        name: identityID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Not signed in
          schema:
            type: string
        "404":
          description: Identity not found
          schema:
            type: string
        "409":
          description: It is the last way to sign in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Unbind a third-party account of the signed-in user
  /auth/ldap/{slug}/sign-in:
    post:
      consumes:
      - application/json
      operationId: ldapSignIn
      parameters:
      - description: Provider slug
        in: path
        name: slug
        required: true
        type: string
      - description: Credential
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/LDAPSignIn'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Profile'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Wrong user name or password
          schema:
            type: string
        "403":
          description: The account is not allowed, not linked or disabled
          schema:
            type: string
        "404":
          description: Provider not found
          schema:
            type: string
        "429":
          description: Too many attempts
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
        "502":
          description: LDAP server unavailable
          schema:
            type: string
      summary: Sign in with LDAP
  /auth/password:
    put:
      consumes:
      - application/json
