      operationId: setAdminWorkflowPluginEnabled
      parameters:
      - description: Plugin ID
        in: path
        name: pluginID
        required: true
        type: string
      - description: Enabled
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SetWorkflowPluginEnabled'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorkflowPlugin'
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Plugin not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Enable or disable a workflow node plugin
  /admin/workflow-plugins/inspect:
    post:
      consumes:
      - application/json
      description: Requires the admin. Compile the source, or download it from the
        URL first, and validate the manifest without installing.
      operationId: inspectAdminWorkflowPlugin
      parameters:
      - description: Source or URL
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/InspectWorkflowPlugin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/InspectWorkflowPluginResp'
        "400":
          description: Invalid plugin
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Check a workflow node plugin before installing
  /admin/workflow-plugins/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. Run execute of the unsaved source or of the
        installed plugin with the config as is, and return the result and the logs.
        Requests are sent for real.
      operationId: testAdminWorkflowPlugin
      parameters:
      - description: Plugin and config
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/TestWorkflowPlugin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestWorkflowPluginResp'
        "400":
          description: Invalid plugin
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Plugin not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
