            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete an API key of a workflow
  /projects/{projectUID}/workflows/{workflowUID}/publish:
    post:
      consumes:
      - application/json
      description: Freeze the draft as a new immutable version which handles the triggers.
        Nothing is published if issues are returned.
      operationId: publishWorkflow
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
        required: true
        type: string
      - description: Draft version
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/PublishWorkflow'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PublishWorkflowResp'
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "409":
          description: Draft changed or route conflict
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
