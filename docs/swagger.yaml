        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the user name or email
        in: query
        name: keyword
        type: string
      - description: Filter by status, all if empty
        enum:
        - active
        - disabled
        - admin
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminUsersResp'
