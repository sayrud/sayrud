  /projects/{projectUID}/ws:
    get:
      description: |-
        Upgrade to WebSocket to submit changesets and receive the changes of the subscribed tables and the online members.
        Messages are JSON `{type, reqId, data}`. Client: SUBSCRIBE, UNSUBSCRIBE, USER_CHANGES, PRESENCE, PING.
        Server: HELLO, SUBSCRIBED, ACCEPT_COMMIT, REJECT_COMMIT, NEW_CHANGES, MEMBERS, TABLES_CHANGED, PROJECT_CHANGED, PERMISSION_CHANGED, ERROR, PONG.
        The changesets of the viewers are rejected.
      operationId: collaborate
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
      summary: Collaborate on the project over WebSocket
