basePath: /_
definitions:
  Action:
    properties:
      action:
        description: Action is the type of the action.
        enum:
        - record.add
        - record.set
        - record.delete
        - field.add
        - field.set
        - field.setType
        - field.setShortcut
        - field.move
        - field.delete
        - view.add
        - view.set
        - view.move
        - view.delete
        - table.dirty
        type: string
      dirty:
        allOf:
        - $ref: '#/definitions/DirtyScope'
        description: Dirty is the data to reload for table.dirty.
      field:
        allOf:
        - $ref: '#/definitions/FieldAttrs'
        description: Field is the field properties for field.add / field.set / field.setType.
      fieldUID:
        description: FieldUID is generated by the client for field.add.
        type: string
      index:
        description: Index is the zero-based position for field.move / view.move,
          and the optional insert position for field.add / view.add.
        type: integer
      keepValues:
        description: KeepValues skips regenerating the existing cells when field.add
          / field.setShortcut sets a shortcut, e.g. duplicating a table.
        type: boolean
      recordUID:
        description: RecordUID is generated by the client for record.add.
        type: string
      recordUIDs:
        description: RecordUIDs are the records to delete for record.delete.
        items:
          type: string
        type: array
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut is the new shortcut for field.setShortcut, null removes
          the shortcut.
      values:
        additionalProperties: true
        description: Values are the cell values keyed by field UID for record.add
          / record.set, a null value clears the cell.
        type: object
      view:
        allOf:
        - $ref: '#/definitions/ViewAttrs'
        description: View is the view properties for view.add / view.set.
      viewUID:
        description: ViewUID is generated by the client for view.add.
        type: string
    required:
    - action
    type: object
  AddProjectMember:
    properties:
      email:
        type: string
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  AdminAISettings:
    properties:
      apiKeySet:
        description: APIKeySet reports whether an API key is saved and readable.
        type: boolean
      baseURL:
        description: BaseURL is the API root including the version, e.g. https://api.openai.com/v1.
        type: string
      enabled:
        description: Enabled reports whether the global AI model is enabled.
        type: boolean
      model:
        description: Model is the name of the model to call.
        type: string
      secretsReady:
        description: SecretsReady is false if auth.secret_key is not configured, the
          API key can not be saved.
        type: boolean
      timeoutSeconds:
        description: TimeoutSeconds is the timeout of a completion request.
        type: integer
    required:
    - apiKeySet
    - baseURL
    - enabled
    - model
    - secretsReady
    - timeoutSeconds
    type: object
  AdminAuthProvider:
    properties:
      acsURL:
        type: string
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      callbackURL:
        description: CallbackURL, ACSURL and MetadataURL are filled in at the identity
          provider, empty if the external URL is not set.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      createdAt:
        type: string
      enabled:
        type: boolean
      hasBindPassword:
        type: boolean
      hasClientSecret:
        description: HasClientSecret and HasBindPassword report whether the secrets
          have been saved.
        type: boolean
      icon:
        type: string
      id:
        type: integer
      identityCount:
        description: IdentityCount is the number of users bound to the sign-in method.
        type: integer
      linkByEmail:
        type: boolean
      metadataURL:
        type: string
      name:
        type: string
      position:
        type: integer
      slug:
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
      updatedAt:
        type: string
    required:
    - acsURL
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - callbackURL
    - config
    - createdAt
    - enabled
    - hasBindPassword
    - hasClientSecret
    - icon
    - id
    - identityCount
    - linkByEmail
    - metadataURL
    - name
    - position
    - slug
    - type
    - updatedAt
    type: object
  AdminCreateUser:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      userName:
        type: string
    required:
    - email
    - isAdmin
    - password
    - userName
    type: object
  AdminCredential:
    properties:
      hasValue:
        type: boolean
      key:
        type: string
      name:
        type: string
      type:
        enum:
        - bearer
        - header
        - query
        type: string
    required:
    - hasValue
    - key
    - type
    type: object
  AdminFieldShortcut:
    properties:
      aiEnabled:
        description: AIEnabled allows the script to call the globally configured AI
          model.
        type: boolean
      code:
        description: Code defines `async function execute(params, context)` returning
          the cell value, with context.ai.complete using the global model when AIEnabled.
        type: string
      createdAt:
        description: CreatedAt is the time the shortcut was created.
        type: string
      credentials:
        description: Credentials are the credentials the script can use when fetching.
        items:
          $ref: '#/definitions/AdminCredential'
        type: array
      description:
        description: Description tells the members what the shortcut does.
        type: string
      domains:
        description: Domains are the hosts the script can fetch, including their subdomains.
        items:
          type: string
        type: array
      enabled:
        description: Enabled reports whether the members can attach and execute the
          shortcut.
        type: boolean
      formItems:
        description: FormItems are the inputs configured in the field editor and passed
          to execute as the params.
        items:
          $ref: '#/definitions/ShortcutFormItem'
        type: array
      name:
        description: Name is shown in the field editor.
        type: string
      resultType:
        description: ResultType is the type of the fields the shortcut can be attached
          to.
        type: string
      timeoutSeconds:
        description: TimeoutSeconds is the time limit of an execution.
        type: integer
      uid:
        description: UID is the identifier the fields refer to the shortcut by.
        type: string
      updatedAt:
        description: UpdatedAt is the time the shortcut was last updated.
        type: string
      usedBy:
        description: UsedBy is the number of the fields using the shortcut.
        type: integer
    required:
    - aiEnabled
    - code
    - createdAt
    - credentials
    - description
    - domains
    - enabled
    - formItems
    - name
    - resultType
    - timeoutSeconds
    - uid
    - updatedAt
    - usedBy
    type: object
  AdminOverview:
    properties:
      activeSessions:
        type: integer
      projects:
        type: integer
      recentUsers:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
      records:
        type: integer
      system:
        $ref: '#/definitions/AdminSystemInfo'
      tables:
        type: integer
      users:
        $ref: '#/definitions/AdminUserStats'
    required:
    - activeSessions
    - projects
    - recentUsers
    - records
    - system
    - tables
    - users
    type: object
  AdminProject:
    properties:
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      memberCount:
        description: MemberCount is the number of collaborators, excluding the owner.
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      tableCount:
        type: integer
      uid:
        type: string
    required:
    - color
    - createdAt
    - icon
    - memberCount
    - name
    - owner
    - tableCount
    - uid
    type: object
  AdminResetPassword:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  AdminSetUserAdmin:
    properties:
      isAdmin:
        type: boolean
    required:
    - isAdmin
    type: object
  AdminSetUserStatus:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  AdminSystemInfo:
    properties:
      buildCommit:
        type: string
      goVersion:
        type: string
      settings:
        $ref: '#/definitions/SystemSettings'
    required:
    - buildCommit
    - goVersion
    - settings
    type: object
  AdminTransferProject:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  AdminUpdateUser:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  AdminUser:
    properties:
      avatarUrl:
        type: string
      color:
        type: string
      createdAt:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      lastSignInAt:
        type: string
      ownedProjectCount:
        type: integer
      providers:
        description: Providers are the sign-in methods bound by the user.
        items:
          $ref: '#/definitions/AuthProviderBrief'
        type: array
      userName:
        type: string
    required:
    - avatarUrl
    - color
    - createdAt
    - disabled
    - email
    - emailMd5
    - id
    - isAdmin
    - lastSignInAt
    - ownedProjectCount
    - providers
    - userName
    type: object
  AdminUserStats:
    properties:
      admins:
        type: integer
      disabled:
        type: integer
      newLast7Days:
        type: integer
      total:
        type: integer
    required:
    - admins
    - disabled
    - newLast7Days
    - total
    type: object
  Attachment:
    properties:
      contentType:
        type: string
      name:
        type: string
      size:
        type: integer
      uid:
        type: string
      url:
        type: string
    required:
    - contentType
    - name
    - size
    - uid
    - url
    type: object
  AuthProviderBrief:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - icon
    - name
    - slug
    type: object
  AuthProviderConfig:
    properties:
      allowIdPInitiated:
        type: boolean
      authURL:
        description: AuthURL, TokenURL and UserInfoURL are the authorization, token
          and user info URLs of OAuth 2.0.
        type: string
      baseDN:
        type: string
      bindDN:
        description: BindDN is the service account to search the users, it binds anonymously
          if empty.
        type: string
      clientID:
        description: ClientID and Scopes are used by OAuth 2.0 and OIDC.
        type: string
      emailAttribute:
        description: EmailAttribute, NameAttribute and GroupsAttribute are the attribute
          names of SAML or LDAP, the common SAML attributes are detected if empty.
        type: string
      emailPath:
        type: string
      emailsURL:
        description: EmailsURL returns [{email, primary, verified}], the primary and
          verified email in it takes precedence if set (GitHub, Gitea).
        type: string
      groupsAttribute:
        type: string
      groupsClaim:
        type: string
      groupsPath:
        type: string
      idpMetadataURL:
        description: IdPMetadataURL or IdPMetadataXML is the metadata of the SAML
          IdP, only one of them is set.
        type: string
      idpMetadataXML:
        type: string
      issuer:
        description: Issuer is the OIDC issuer for discovery.
        type: string
      nameAttribute:
        type: string
      nameClaim:
        type: string
      namePath:
        type: string
      rootCA:
        description: RootCA is the CA in PEM to verify the LDAP server certificate,
          the system CAs are used if empty.
        type: string
      scopes:
        items:
          type: string
        type: array
      spCertificate:
        description: SPCertificate is the generated SP certificate in PEM, the private
          key is in Secrets.
        type: string
      startTLS:
        type: boolean
      subjectAttribute:
        type: string
      subjectPath:
        description: SubjectPath, EmailPath, NamePath and GroupsPath are the dot paths
          in the user info JSON, e.g. data.user.email.
        type: string
      tokenURL:
        type: string
      trustEmail:
        description: TrustEmail treats the email from the IdP as verified, OIDC uses
          email_verified instead.
        type: boolean
      url:
        description: URL is the LDAP server address, ldap:// or ldaps://.
        type: string
      userFilter:
        description: The {username} in UserFilter is replaced with the escaped user
          name of the sign-in.
        type: string
      userInfoURL:
        type: string
    type: object
  BatchCreateRecords:
    properties:
      data:
        description: Data is the list of cell values keyed by field UID, one item
          for each record.
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - data
    type: object
  Changeset:
    properties:
      clientId:
        description: ClientID is the connection that submits the changeset, it is
          empty for the changesets generated by the server.
        type: string
      operations:
        items:
          $ref: '#/definitions/Operation'
        type: array
      rev:
        type: integer
      signature:
        description: Signature is generated by the submitting client to recognize
          its own changeset, it is empty for the changesets generated by the server.
        type: string
      tableUID:
        type: string
    required:
    - clientId
    - operations
    - rev
    - signature
    - tableUID
    type: object
  CreateAuthProvider:
    properties:
      allowedEmailDomains:
        items:
          type: string
        type: array
      allowedGroups:
        items:
          type: string
        type: array
      autoCreateUser:
        type: boolean
      bindPassword:
        description: BindPassword is the password of the LDAP service account, empty
          keeps the saved one when updating.
        type: string
      clientSecret:
        description: ClientSecret is the client secret of OAuth 2.0 or OIDC, empty
          keeps the saved one when updating.
        type: string
      config:
        $ref: '#/definitions/AuthProviderConfig'
      enabled:
        type: boolean
      icon:
        type: string
      linkByEmail:
        type: boolean
      name:
        type: string
      slug:
        description: Slug is part of the callback URL and can not be changed after
          creating.
        type: string
      type:
        enum:
        - oauth2
        - oidc
        - saml
        - ldap
        type: string
    required:
    - allowedEmailDomains
    - allowedGroups
    - autoCreateUser
    - config
    - enabled
    - icon
    - linkByEmail
    - name
    - slug
    - type
    type: object
  CreateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
    required:
    - label
    - type
    type: object
  CreateFields:
    properties:
      fields:
        items:
          $ref: '#/definitions/CreateField'
        type: array
    required:
    - fields
    type: object
  CreateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
    type: object
  CreateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateWorkflow:
    properties:
      description:
        type: string
      name:
        type: string
      tableUID:
        description: TableUID is the table used by the API template, or the table
          watched by the record and date triggers.
        type: string
      template:
        description: 'Template is the template of the API trigger: blank, create or
          query, the latter two generate the default spec from the table of TableUID.'
        enum:
        - blank
        - create
        - query
        type: string
      timezone:
        description: Timezone is the creator's time zone, e.g. Asia/Shanghai, used
          by the formulas and the schedule trigger.
        type: string
      triggerType:
        description: TriggerType is the trigger type, an empty value creates a blank
          workflow without a trigger type chosen yet.
        enum:
        - ""
        - api
        - record_created
        - record_updated
        - record_matched
        - record_deleted
        - date_reached
        - schedule
        type: string
    required:
    - description
    - name
    - template
    - triggerType
    type: object
  CreateWorkflowKey:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateWorkflowKeyResp:
    properties:
      key:
        $ref: '#/definitions/WorkflowKey'
      secret:
        type: string
    required:
    - key
    - secret
    type: object
  Credential:
    properties:
      createdAt:
        type: string
      data:
        additionalProperties: true
        type: object
      name:
        type: string
      secrets:
        description: Secrets lists the saved secret fields.
        items:
          type: string
        type: array
      type:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - data
    - name
    - secrets
    - type
    - uid
    - updatedAt
    type: object
  DebugWorkflow:
    properties:
      body:
        description: Body is the JSON request body, empty means no request body is
          sent.
        type: object
      draft:
        allOf:
        - $ref: '#/definitions/workflow.Spec'
        description: Draft debugs the saved draft if empty.
      headers:
        additionalProperties:
          type: string
        type: object
      mode:
        description: Mode is dry_run (rolls back the writes, without running the async
          flows and external actions) or live (runs for real).
        enum:
        - dry_run
        - live
        type: string
      query:
        additionalProperties:
          type: string
        description: Query, Headers and Body are the request when debugging the API
          trigger.
        type: object
      recordUID:
        description: RecordUID is the record used as the triggering record when debugging
          the record and date triggers, the latest record is used if empty.
        type: string
    required:
    - mode
    type: object
  DebugWorkflowResp:
    properties:
      durationMs:
        type: integer
      errors:
        items:
          $ref: '#/definitions/WorkflowParamError'
        type: array
      input:
        type: object
      issues:
        items:
          $ref: '#/definitions/WorkflowIssue'
        type: array
      jobs:
        items:
          $ref: '#/definitions/WorkflowPlannedJob'
        type: array
      response:
        $ref: '#/definitions/WorkflowResponse'
      runUID:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/db.WorkflowRunStatus'
        enum:
        - queued
        - succeeded
        - failed
        - rejected
      trace:
        items:
          $ref: '#/definitions/WorkflowTraceStep'
        type: array
    required:
    - durationMs
    - errors
    - input
    - issues
    - jobs
    - response
    - runUID
    - status
    - trace
    type: object
  DeleteAccount:
    properties:
      confirmEmail:
        description: ConfirmEmail is the own email entered by users without a password.
        type: string
      password:
        description: Password is the current password of users with one.
        type: string
    type: object
  DirtyScope:
    properties:
      allRecords:
        type: boolean
      fields:
        type: boolean
      records:
        items:
          type: string
        type: array
      views:
        type: boolean
    type: object
  FetchRecords:
    properties:
      uids:
        items:
          type: string
        type: array
    required:
    - uids
    type: object
  FieldAttrs:
    properties:
      label:
        description: Label is the title of the field.
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      shortcut:
        allOf:
        - $ref: '#/definitions/FieldShortcut'
        description: Shortcut is the optional shortcut of the new field for field.add.
      type:
        description: Type is the type of the field, the values are converted for field.setType.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - attachment
        - formula
        type: string
    type: object
  FieldShortcut:
    properties:
      autoUpdate:
        description: AutoUpdate regenerates the cell when any referenced field of
          the record changes.
        type: boolean
      id:
        description: ID is the UID of a custom shortcut.
        type: string
      inputs:
        additionalProperties: true
        description: |-
          Inputs are the configured values keyed by the form item key, a field_select item stores the field UID,
          and a prompt item stores the text referencing the fields by `{fieldUID}`.
        type: object
    required:
    - autoUpdate
    - id
    - inputs
    type: object
  FieldShortcutManifest:
    properties:
      aiEnabled:
        description: AIEnabled reports whether the script is allowed to use the globally
          configured AI model.
        type: boolean
      available:
        description: Available is false if the shortcut is disabled or its AI configuration
          is unavailable.
        type: boolean
      description:
        description: Description tells what the shortcut does.
        type: string
      formItems:
        description: FormItems are the inputs to configure in the field editor.
        items:
          $ref: '#/definitions/ShortcutFormItem'
        type: array
      id:
        description: ID is the UID of a custom shortcut.
        type: string
      kind:
        description: Kind is how the shortcut is executed, by a custom script.
        enum:
        - script
        type: string
      name:
        description: Name is shown in the field editor.
        type: string
      resultTypes:
        description: ResultTypes are the types of the fields the shortcut can be attached
          to.
        items:
          type: string
        type: array
    required:
    - aiEnabled
    - available
    - description
    - formItems
    - id
    - kind
    - name
    - resultTypes
    type: object
  Import:
    properties:
      done:
        description: Done is the number of the records inserted, they are visible
          only after the import succeeds.
        type: integer
      error:
        description: Error is the reason of the failure in the language of the request.
        type: string
      status:
        allOf:
        - $ref: '#/definitions/db.SLImportStatus'
        description: Status is the state of the import, a running import without progress
          for a minute is reported as failed.
        enum:
        - pending
        - running
        - succeeded
        - failed
      tableUID:
        description: TableUID is the table the import writes to, empty before a new
          table is created.
        type: string
      total:
        description: Total is the number of the records to insert.
        type: integer
      uid:
        description: UID identifies the import.
        type: string
    required:
    - done
    - status
    - tableUID
    - total
    - uid
    type: object
  ImportColumnSchema:
    properties:
      empty:
        description: Empty reports whether the rows after the first row are all empty.
        type: boolean
      emptyWithoutHeader:
        description: EmptyWithoutHeader reports whether all the rows are empty.
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/db.SLFieldType'
        description: Type is inferred from the rows after the first row.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
      typeWithoutHeader:
        allOf:
        - $ref: '#/definitions/db.SLFieldType'
        description: TypeWithoutHeader is inferred from all the rows.
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
    required:
    - empty
    - emptyWithoutHeader
    - type
    - typeWithoutHeader
    type: object
  ImportSheet:
    properties:
      columns:
        description: Columns are the inferred schemas of the columns, excluding the
          trailing empty ones.
        items:
          $ref: '#/definitions/ImportColumnSchema'
        type: array
      name:
        description: Name is the sheet name, or the file name without the extension
          for the CSV files.
        type: string
      rowCount:
        description: RowCount is the number of the non-blank rows, including the header
          row.
        type: integer
      rows:
        description: Rows are the displayed texts of the leading rows, each padded
          to the number of the columns.
        items:
          items:
            type: string
          type: array
        type: array
    required:
    - columns
    - name
    - rowCount
    - rows
    type: object
  ImportUpload:
    properties:
      fileName:
