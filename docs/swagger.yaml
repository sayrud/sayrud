    get:
      description: Requires the admin.
      operationId: getAdminWorkflowPlugin
      parameters:
      - description: Plugin ID
        in: path
        name: pluginID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WorkflowPlugin'
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Plugin not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a workflow node plugin with its source
  /admin/workflow-plugins/{pluginID}/enabled:
    put:
      consumes:
      - application/json
      description: Requires the admin. A disabled node can not be added, published
