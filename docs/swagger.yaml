      parameters:
      - description: System settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateSystemSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
