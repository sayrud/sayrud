      parameters:
      - description: Identity ID
        in: path
        name: identityID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Not signed in
          schema:
            type: string
        "404":
          description: Identity not found
          schema:
            type: string
        "409":
          description: It is the last way to sign in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
