        their email instead.
      operationId: deleteAccount
      parameters:
      - description: Password or email confirmation
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/DeleteAccount'
      responses:
        "204":
          description: No Content
        "400":
          description: Wrong password or email
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "409":
          description: The user still owns projects or is the last admin
          schema:
            type: string
        "429":
          description: Too many attempts
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete the account of the signed-in user
  /auth/avatar:
    delete:
      operationId: removeAvatar
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Profile'
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Restore the default avatar of the signed-in user
    post:
      consumes:
      - multipart/form-data
      description: Accept a PNG, JPEG or GIF up to 2 MiB and 4096 pixels per edge.
        Store a static PNG with its longest edge at most 512 pixels.
      operationId: uploadAvatar
      parameters:
      - description: Avatar image
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Profile'
        "400":
          description: Invalid image or multipart body
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "413":
          description: Image is too large
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Upload the avatar of the signed-in user
