      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestFieldShortcutResp'
        "400":
          description: Invalid shortcut
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test a custom field shortcut
  /admin/overview:
    get:
