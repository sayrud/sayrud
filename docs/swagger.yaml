            type: string
        "404":
          description: Project or workflow not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the published versions of a workflow
  /projects/{projectUID}/workflows/{workflowUID}/revisions/{version}/rollback:
    post:
      consumes:
      - application/json
      description: Republish the spec of the version as a new version, the draft is
        overwritten by it.
      operationId: rollbackWorkflow
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
        required: true
        type: string
      - description: Version to roll back to
        in: path
        name: version
        required: true
        type: integer
      - description: Draft version
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/RollbackWorkflow'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PublishWorkflowResp'
        "400":
          description: The version references deleted tables, fields or credentials
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
