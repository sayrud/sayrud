      parameters:
      - description: Profile
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateProfile'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Profile'
