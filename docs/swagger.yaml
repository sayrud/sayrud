        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminUpdateUser'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
