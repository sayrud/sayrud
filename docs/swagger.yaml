  /auth/sso/{slug}/callback:
    get:
      description: Signs in (or binds the account in the link mode) and redirects
        to the saved path. Failures redirect with the sso_error query.
      operationId: ssoCallback
      parameters:
      - description: Provider slug
        in: path
        name: slug
        required: true
        type: string
      - description: State
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        type: string
      responses:
        "302":
          description: Redirect after signing in
      summary: OAuth 2.0 / OIDC callback
  /auth/sso/{slug}/metadata:
    get:
      description: The entity ID of the service provider is the URL of this metadata.
        Available before the provider is enabled.
      operationId: ssoMetadata
      parameters:
      - description: Provider slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - text/xml
      responses:
        "200":
          description: SP metadata XML
          schema:
            type: string
        "404":
          description: Provider not found or not SAML
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: SAML service provider metadata
  /auth/sso/{slug}/start:
    get:
      description: Redirects the browser to the identity provider. In the link mode
        the signed-in user binds the third-party account. Failures redirect to the
        sign-in page (or the security settings in the link mode) with the sso_error
        query.
      operationId: startSSO
      parameters:
      - description: Provider slug
        in: path
        name: slug
        required: true
        type: string
      - description: login or link, defaults to login
        enum:
        - login
        - link
        in: query
        name: mode
        type: string
      - description: Path to go after signing in
        in: query
        name: redirect
        type: string
      responses:
        "302":
          description: Redirect to the identity provider
      summary: Start a third-party sign-in
  /avatars/{fileUID}:
    get:
      operationId: getAvatar
      parameters:
      - description: Avatar file UID
        in: path
        name: fileUID
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Avatar not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a current uploaded avatar
  /projects:
    get:
      description: List the projects owned by or shared with the signed-in user, with
        the number of tables in each project.
      operationId: listProjects
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: 'owned: created by the user, shared: shared with the user, both
          if empty'
        enum:
        - owned
        - shared
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListProjectsResp'
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List projects
    post:
      consumes:
      - application/json
      description: Create a project owned by the signed-in user.
      operationId: createProject
      parameters:
      - description: Project to create
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CreateProject'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Project'
        "400":
          description: Invalid request body
          schema:
            type: string
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a project
  /projects/{projectUID}:
    delete:
      description: Delete the project along with its collaborators, only the owner
        can delete it.
      operationId: deleteProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a project
    get:
      operationId: getProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Project'
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a project
    put:
      consumes:
      - application/json
      description: Requires the editor role.
      operationId: updateProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Project properties
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateProject'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid request body
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update a project
  /projects/{projectUID}/attachments/{fileUID}:
    get:
      description: Read a file uploaded in this project. Project membership is checked
