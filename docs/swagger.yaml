        required: true
        schema:
          $ref: '#/definitions/AdminSetUserStatus'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid operation
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "409":
          description: The last admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
