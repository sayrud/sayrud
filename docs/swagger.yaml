      parameters:
      - description: Share token
        in: path
        name: shareToken
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Link password required
          schema:
            type: string
        "404":
          description: Share unavailable
          schema:
            type: string
      summary: Follow a public share over WebSocket
  /shares/resolve:
    get:
      description: Returns only an enabled share token. Password verification and
