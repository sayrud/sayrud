        in: query
        name: download
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Not signed in
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or attachment not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Read an attachment
  /projects/{projectUID}/credentials:
    get:
      description: The values of the secret fields are not returned. Filter by type
        with the type query.
      operationId: listCredentials
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Credential type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Credential'
            type: array
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the credentials of a project
    post:
      consumes:
      - application/json
      description: The fields are defined by the DSL of the credential type, the secret
        fields are encrypted by auth.secret_key.
      operationId: createCredential
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Credential
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SaveCredential'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Credential'
        "400":
          description: Invalid credential
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a credential in a project
  /projects/{projectUID}/credentials/{credentialUID}:
    delete:
      description: A credential referenced by a published workflow can not be deleted.
      operationId: deleteCredential
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Credential UID
        in: path
        name: credentialUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or credential not found
          schema:
            type: string
        "409":
          description: Used by a published workflow
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a credential
    put:
      consumes:
      - application/json
      description: Takes effect immediately for the workflows that reference it. The
        empty secret fields keep the saved values.
      operationId: updateCredential
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Credential UID
        in: path
        name: credentialUID
        required: true
        type: string
      - description: Credential
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SaveCredential'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Credential'
        "400":
          description: Invalid credential or the saved secrets can not be decrypted
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or credential not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update a credential
  /projects/{projectUID}/credentials/test:
    post:
      consumes:
      - application/json
      description: Run the test action of the credential type (e.g. send a test email)
        with the unsaved values; the saved secrets of credentialUID are used for the
        fields not given.
      operationId: testCredential
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Credential and the test input
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/TestCredential'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid credential or the test failed
          schema:
            type: string
        "403":
          description: Permission denied
          schema:
            type: string
        "404":
          description: Project or credential not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test a credential
