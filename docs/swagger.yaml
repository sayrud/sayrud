  /auth/profile:
    get:
      operationId: getProfile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Profile'
        "401":
          description: Not signed in
          schema:
            type: string
        "500":
          description: Internal server error
