        enum:
        - string
        - number
        - integer
        - boolean
        - date
        - datetime
        - enum
        - array
        type: string
    required:
    - id
    - key
    - required
    - source
    - type
    type: object
  WorkflowParamError:
    properties:
      code:
        type: string
      message:
        type: string
      param:
        type: string
      path:
        type: string
    required:
    - code
    - message
    - param
    - path
    type: object
  WorkflowPlannedJob:
    properties:
      event:
        type: string
      flowID:
        type: string
      name:
        type: string
      queued:
        description: Queued is false for a dry run, which only lists the flows that
          would be triggered.
        type: boolean
    required:
    - event
    - flowID
    - name
    - queued
    type: object
  WorkflowPlugin:
    properties:
      checksum:
        type: string
      createdAt:
        type: string
      credential:
        allOf:
        - $ref: '#/definitions/WorkflowCredentialTypeDef'
        description: Credential is the credential type defined by the plugin, nil
          if there is none.
      domains:
        description: Domains are the hosts the node can fetch, including their subdomains;
          * allows any public host.
        items:
          type: string
        type: array
      enabled:
        type: boolean
      id:
        description: ID is the id of the manifest; the steps of the node have the
          type plugin:<id>.
        type: string
      language:
        description: Language is the source language, javascript or typescript.
        enum:
        - javascript
        - typescript
        type: string
      module:
        allOf:
        - $ref: '#/definitions/WorkflowModuleDef'
        description: Module is the node DSL rendered by the workflow editor.
      source:
        description: Source is the source code, only returned when getting a single
          plugin.
        type: string
      sourceURL:
        description: SourceURL is the address the source was downloaded from, empty
          if uploaded or written by hand.
        type: string
      timeout:
        description: Timeout is the time limit of a call in seconds.
        type: integer
      updatedAt:
        type: string
      usedBy:
        description: UsedBy is the number of workflows whose draft or published revision
          uses the node.
        type: integer
      version:
        type: string
    required:
    - checksum
    - createdAt
    - domains
    - enabled
    - id
    - language
    - module
    - sourceURL
    - timeout
    - updatedAt
    - usedBy
    - version
    type: object
  WorkflowRateLimit:
    properties:
      enabled:
        type: boolean
      limit:
        description: Limit is the maximum number of requests allowed per window.
        type: integer
      window:
        description: Window is the window length in seconds.
        type: integer
    required:
    - enabled
    - limit
    - window
    type: object
  WorkflowRecordTrigger:
    properties:
      dateFieldUID:
        description: DateFieldUID is the date field for date_reached, and Offset is
          the offset in minutes from the field's time; negative means earlier.
        type: string
      fields:
        description: Fields are the field UIDs watched by record_updated; empty means
          any field.
        items:
          type: string
        type: array
      filters:
        description: Filters are the conditions a record must satisfy and may only
          use constant values; record_matched requires at least one condition, and
          Match is all or any.
        items:
          $ref: '#/definitions/WorkflowFilter'
        type: array
      match:
        enum:
        - all
        - any
        type: string
      offset:
        type: integer
      tableUID:
        type: string
    required:
    - tableUID
    type: object
  WorkflowResponse:
    properties:
      body:
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      status:
        type: integer
    required:
    - body
    - headers
    - status
    type: object
  WorkflowRevision:
    properties:
      createdAt:
        type: string
      createdBy:
        $ref: '#/definitions/UserBrief'
      method:
        type: string
      path:
        type: string
      restoredFrom:
        description: RestoredFrom is the version this revision rolls back to, 0 if
          published from the draft.
        type: integer
      triggerType:
        type: string
      version:
        type: integer
    required:
    - createdAt
    - createdBy
    - method
    - path
    - restoredFrom
    - triggerType
    - version
    type: object
  WorkflowRun:
    properties:
      createdAt:
        type: string
      durationMs:
        type: integer
      error:
        type: object
      event:
        type: object
      ip:
        type: string
      jobs:
        items:
          $ref: '#/definitions/WorkflowJob'
        type: array
      request:
        description: Request, Event, Response, Trace and Error are only returned in
          the detail, Event is the trigger data of a background trigger.
        type: object
      response:
        type: object
      status:
        enum:
        - queued
        - running
        - succeeded
        - failed
        - rejected
        type: string
      statusCode:
        type: integer
      trace:
        items:
          $ref: '#/definitions/WorkflowTraceStep'
        type: array
      trigger:
        description: 'Trigger is the source of the run: http, debug, or the trigger
          type of a background trigger.'
        type: string
      uid:
        type: string
      version:
        type: integer
    required:
    - createdAt
    - durationMs
    - ip
    - jobs
    - status
    - statusCode
    - trigger
    - uid
    - version
    type: object
  WorkflowScheduleTrigger:
    properties:
      interval:
        description: Interval is the interval for minutes and hours; a minute interval
          is at least 5.
        type: integer
      repeat:
        enum:
        - none
        - minutes
        - hours
        - daily
        - workdays
        - weekly
        - monthly
        type: string
      start:
        description: Start is the local time of the first run, formatted as 2006-01-02T15:04.
        type: string
      timezone:
        type: string
      weekdays:
        description: Weekdays are the days of the week for weekly runs; 0 is Sunday.
        items:
          type: integer
        type: array
    required:
    - repeat
    - start
    - timezone
    type: object
  WorkflowSectionDef:
    properties:
      description:
        type: string
      extra:
        allOf:
        - $ref: '#/definitions/WorkflowFieldDef'
        description: Extra is a compact field shown on the right of the section title.
      fields:
        items:
          $ref: '#/definitions/WorkflowFieldDef'
        type: array
      showIf:
        type: string
      title:
        type: string
    required:
    - fields
    type: object
  WorkflowStep:
    properties:
      config:
        description: Config is the module configuration defined by the DSL of the
          type (see ModuleDef), decoded as the matching *XxxConfig.
        type: object
      else:
        items:
          $ref: '#/definitions/WorkflowStep'
        type: array
      id:
        type: string
      name:
        type: string
      then:
        description: Then and Else are the branches of a branching module (condition).
        items:
          $ref: '#/definitions/WorkflowStep'
        type: array
      type:
        description: Type is a built-in module (query, create, update, condition,
          response, email, http) or an installed plugin (plugin:<id>).
        type: string
    required:
    - config
    - id
    - type
    type: object
  WorkflowSummaryDef:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      fallback:
        type: string
      parts:
        items:
          type: string
        type: array
      requires:
        description: Fallback is shown while the Requires field is empty.
        type: string
      separator:
        type: string
      template:
        type: string
    type: object
  WorkflowTraceStep:
    properties:
      branch:
        description: Branch is the branch a condition node entered, then or else.
        type: string
      durationMs:
        type: integer
      error:
        type: string
      logs:
        description: Logs are the lines printed by a plugin node.
        items:
          type: string
        type: array
      name:
        type: string
      output:
        description: Output is the truncated step output.
        type: object
      reused:
        description: Reused means an async retry reused the output of the previous
          successful attempt.
        type: boolean
      status:
        enum:
        - succeeded
        - failed
        - skipped
        - planned
        type: string
      stepID:
        type: string
      type:
        type: string
    required:
    - durationMs
    - status
    - stepID
    - type
    type: object
  WorkflowTrigger:
    properties:
      api:
        allOf:
        - $ref: '#/definitions/WorkflowAPITrigger'
        description: API is the request endpoint, authentication and parameters of
          an api trigger.
      name:
        description: Name is the display name of the trigger node; when empty, the
          trigger type's name is shown.
        type: string
      record:
        allOf:
        - $ref: '#/definitions/WorkflowRecordTrigger'
        description: Record is the table watched by record triggers and date_reached.
      schedule:
        allOf:
        - $ref: '#/definitions/WorkflowScheduleTrigger'
        description: Schedule is the execution time of a schedule trigger.
      type:
        enum:
        - ""
        - api
        - record_created
        - record_updated
        - record_matched
        - record_deleted
        - date_reached
        - schedule
        type: string
    required:
    - type
    type: object
  WorkflowValue:
    properties:
      const:
        type: object
      formula:
        type: string
      kind:
        enum:
        - const
        - var
        - template
        - formula
        type: string
      template:
        type: string
      var:
        type: string
    required:
    - kind
    type: object
  db.SLFieldType:
    enum:
    - text
    - single_select
    - multi_select
    - datetime
    - number
    - checkbox
    - attachment
    - formula
    - unknown
    type: string
    x-enum-varnames:
    - TextFieldType
    - SingleSelectFieldType
    - MultiSelectFieldType
    - DateTimeFieldType
    - NumberFieldType
    - CheckboxFieldType
    - AttachmentFieldType
    - FormulaFieldType
    - UnknownFieldType
  db.SLImportStatus:
    enum:
    - pending
    - running
    - succeeded
    - failed
    type: string
    x-enum-varnames:
    - SLImportPending
    - SLImportRunning
    - SLImportSucceeded
    - SLImportFailed
  db.WorkflowRunStatus:
    enum:
    - queued
    - running
    - succeeded
    - failed
    - rejected
    type: string
    x-enum-varnames:
    - WorkflowRunQueued
    - WorkflowRunRunning
    - WorkflowRunSucceeded
    - WorkflowRunFailed
    - WorkflowRunRejected
  workflow.Spec:
    properties:
      async:
        description: Async holds the flows an API trigger runs in the background after
          request events; empty for other triggers.
        items:
          $ref: '#/definitions/WorkflowAsyncFlow'
        type: array
      steps:
        description: 'Steps is the main flow: executed synchronously to build the
          response for API triggers, and in the background for other triggers.'
        items:
          $ref: '#/definitions/WorkflowStep'
        type: array
      timezone:
        description: Timezone is the IANA time zone in which formulas handle dates,
          e.g. Asia/Shanghai; UTC is used when it is empty or invalid.
        type: string
      trigger:
        $ref: '#/definitions/WorkflowTrigger'
    required:
    - async
    - steps
    - trigger
    type: object
info:
  contact: {}
  title: Sayrud API
  version: "1.0"
paths:
  /admin/ai:
    get:
      description: Requires the admin. The API key is not returned.
      operationId: getAdminAISettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAISettings'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the AI model settings
    put:
      consumes:
      - application/json
      description: Requires the admin. The API key is encrypted by auth.secret_key,
        empty keeps the saved one. It updates the global AI model configuration immediately.
      operationId: updateAdminAISettings
      parameters:
      - description: AI model settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAISettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAISettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the AI model settings
  /admin/ai/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. Send a short message to the unsaved model,
        the saved API key is used if it is not given.
      operationId: testAdminAISettings
      parameters:
      - description: AI model settings to test
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAISettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestAISettingsResp'
        "400":
          description: Invalid settings or the request failed
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test the AI model settings
  /admin/auth-providers:
    get:
      description: Requires the admin. The secrets are not returned.
      operationId: listAdminAuthProviders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminAuthProvidersResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the sign-in methods
    post:
      consumes:
      - application/json
      description: Requires the admin and auth.secret_key in the config file. The
        SAML service provider certificate is generated automatically.
      operationId: createAdminAuthProvider
      parameters:
      - description: Sign-in method
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CreateAuthProvider'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAuthProvider'
        "400":
          description: Invalid config
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "409":
          description: The slug has been used
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a sign-in method
  /admin/auth-providers/{providerID}:
    delete:
      description: Requires the admin. The bound third-party accounts of the users
        are unbound.
      operationId: deleteAdminAuthProvider
      parameters:
      - description: Provider ID
        in: path
        name: providerID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Provider not found
          schema:
            type: string
        "409":
          description: It is the last enabled sign-in method while password sign-in
            is disabled
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a sign-in method
    put:
      consumes:
      - application/json
      description: Requires the admin. The slug and the type can not be changed, the
        empty secrets keep the saved ones.
      operationId: updateAdminAuthProvider
      parameters:
      - description: Provider ID
        in: path
        name: providerID
        required: true
        type: integer
      - description: Sign-in method
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateAuthProvider'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAuthProvider'
        "400":
          description: Invalid config
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Provider not found
          schema:
            type: string
        "409":
          description: It is the last enabled sign-in method while password sign-in
            is disabled
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update a sign-in method
  /admin/auth-providers/positions:
    put:
      consumes:
      - application/json
      description: Requires the admin. The sign-in page shows them in this order.
      operationId: setAdminAuthProviderPositions
      parameters:
      - description: Provider IDs in order
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SetAuthProviderPositions'
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Reorder the sign-in methods
  /admin/auth-providers/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. OIDC fetches the discovery document, SAML loads
        the IdP metadata, LDAP binds the service account and optionally searches the
        user. OAuth 2.0 is not supported.
      operationId: testAdminAuthProvider
      parameters:
      - description: Config to test
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/TestAuthProvider'
      responses:
        "204":
          description: No Content
        "400":
          description: The connection failed or the type is not supported
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test the connection of a sign-in method
  /admin/field-shortcuts:
    get:
      description: Requires the admin. The credential values are not returned.
      operationId: listAdminFieldShortcuts
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the shortcut name or description
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminFieldShortcutsResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the custom field shortcuts
    post:
      consumes:
      - application/json
      description: Requires the admin. The credential values are encrypted by auth.secret_key.
      operationId: createAdminFieldShortcut
      parameters:
      - description: Shortcut
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SaveFieldShortcut'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminFieldShortcut'
        "400":
          description: Invalid shortcut
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create a custom field shortcut
  /admin/field-shortcuts/{shortcutUID}:
    delete:
      description: Requires the admin. The fields using it keep their values, and
        fail to generate new ones.
      operationId: deleteAdminFieldShortcut
      parameters:
      - description: Shortcut UID
        in: path
        name: shortcutUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Shortcut not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a custom field shortcut
    get:
      description: Requires the admin. The credential values are not returned.
      operationId: getAdminFieldShortcut
      parameters:
      - description: Shortcut UID
        in: path
        name: shortcutUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminFieldShortcut'
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Shortcut not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a custom field shortcut
    put:
      consumes:
      - application/json
      description: Requires the admin. The empty credential values keep the saved
        ones.
      operationId: updateAdminFieldShortcut
      parameters:
      - description: Shortcut UID
        in: path
        name: shortcutUID
        required: true
        type: string
      - description: Shortcut
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/SaveFieldShortcut'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminFieldShortcut'
        "400":
          description: Invalid shortcut
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Shortcut not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update a custom field shortcut
  /admin/field-shortcuts/test:
    post:
      consumes:
      - application/json
      description: Requires the admin. Run the unsaved code with the parameters, and
        return the result and the logs.
      operationId: testAdminFieldShortcut
      parameters:
      - description: Shortcut and parameters
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/TestFieldShortcut'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TestFieldShortcutResp'
        "400":
          description: Invalid shortcut
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Test a custom field shortcut
  /admin/overview:
    get:
      description: Requires the admin.
      operationId: getAdminOverview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminOverview'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the overview of the system
  /admin/projects:
    get:
      description: Requires the admin. The newest projects come first.
      operationId: listAdminProjects
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the project name
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminProjectsResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List all the projects
  /admin/projects/{projectUID}:
    delete:
      description: Requires the admin.
      operationId: deleteAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a project
  /admin/projects/{projectUID}/owner:
    put:
      consumes:
      - application/json
      description: Requires the admin. The new owner can be any enabled user, the
        previous owner becomes a manager.
      operationId: transferAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: New owner
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminTransferProject'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid new owner
          schema:
            type: string
        "403":
