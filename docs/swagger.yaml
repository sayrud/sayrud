  /projects/{projectUID}/workflows/{workflowUID}/runs:
    get:
      operationId: listWorkflowRuns
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: Workflow UID
        in: path
        name: workflowUID
