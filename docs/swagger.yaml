      parameters:
      - description: Shortcut UID
        in: path
        name: shortcutUID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminFieldShortcut'
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Shortcut not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get a custom field shortcut
    put:
      consumes:
      - application/json
      description: Requires the admin. The empty credential values keep the saved
