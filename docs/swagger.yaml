        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateSystemSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the system settings
  /admin/users:
    get:
      description: Requires the admin. The newest users come first.
      operationId: listAdminUsers
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the user name or email
        in: query
        name: keyword
        type: string
      - description: Filter by status, all if empty
        enum:
        - active
        - disabled
        - admin
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminUsersResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List the users
