basePath: /_
definitions:
  AIAdvice:
    properties:
      action:
        enum:
        - tables
        type: string
      messages:
        items:
          $ref: '#/definitions/AIMessage'
        type: array
    required:
    - action
    - messages
    type: object
  AIAdviceResp:
    properties:
      action:
        type: string
      actionJson:
        description: ActionJSON is the structured payload of the action, which can
          be passed to the apply API as is.
        type: object
      description:
        type: string
      raw:
        description: Raw is the raw output of the model.
        type: string
    required:
    - action
    - actionJson
    - description
    - raw
    type: object
  AIApply:
    properties:
      action:
        enum:
        - tables
        type: string
      actionJson:
        description: ActionJson is the actionJson returned by the advice API.
        type: object
    required:
    - action
    - actionJson
    type: object
  AIMessage:
    properties:
      content:
        type: string
      role:
        type: string
    required:
    - content
    - role
    type: object
  Action:
    properties:
      action:
        enum:
        - record.add
        - record.set
        - record.delete
        - field.add
        - field.set
        - field.setType
        - field.move
        - field.delete
        - view.add
        - view.set
        - view.move
        - view.delete
        - table.dirty
        type: string
      dirty:
        $ref: '#/definitions/DirtyScope'
      field:
        $ref: '#/definitions/FieldAttrs'
      fieldUID:
        description: FieldUID is generated by the client for field.add.
        type: string
      index:
        description: Index is the zero-based position for field.move / view.move,
          and the optional insert position for field.add / view.add.
        type: integer
      recordUID:
        description: RecordUID is generated by the client for record.add.
        type: string
      recordUIDs:
        items:
          type: string
        type: array
      values:
        additionalProperties: true
        description: Values are the cell values keyed by field UID for record.add
          / record.set, a null value clears the cell.
        type: object
      view:
        $ref: '#/definitions/ViewAttrs'
      viewUID:
        description: ViewUID is generated by the client for view.add.
        type: string
    required:
    - action
    type: object
  AddProjectMember:
    properties:
      email:
        type: string
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  AdminCreateUser:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
      userName:
        type: string
    required:
    - email
    - isAdmin
    - password
    - userName
    type: object
  AdminOverview:
    properties:
      activeSessions:
        type: integer
      projects:
        type: integer
      recentUsers:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
      records:
        type: integer
      system:
        $ref: '#/definitions/AdminSystemInfo'
      tables:
        type: integer
      users:
        $ref: '#/definitions/AdminUserStats'
    required:
    - activeSessions
    - projects
    - recentUsers
    - records
    - system
    - tables
    - users
    type: object
  AdminProject:
    properties:
      createdAt:
        type: string
      memberCount:
        description: MemberCount is the number of collaborators, excluding the owner.
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      tableCount:
        type: integer
      uid:
        type: string
    required:
    - createdAt
    - memberCount
    - name
    - owner
    - tableCount
    - uid
    type: object
  AdminResetPassword:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  AdminSetUserAdmin:
    properties:
      isAdmin:
        type: boolean
    required:
    - isAdmin
    type: object
  AdminSetUserStatus:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  AdminSystemInfo:
    properties:
      buildCommit:
        type: string
      goVersion:
        type: string
      settings:
        $ref: '#/definitions/SystemSettings'
    required:
    - buildCommit
    - goVersion
    - settings
    type: object
  AdminTransferProject:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  AdminUpdateUser:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  AdminUser:
    properties:
      color:
        type: string
      createdAt:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      lastSignInAt:
        type: string
      ownedProjectCount:
        type: integer
      userName:
        type: string
    required:
    - color
    - createdAt
    - disabled
    - email
    - emailMd5
    - id
    - isAdmin
    - lastSignInAt
    - ownedProjectCount
    - userName
    type: object
  AdminUserStats:
    properties:
      admins:
        type: integer
      disabled:
        type: integer
      newLast7Days:
        type: integer
      total:
        type: integer
    required:
    - admins
    - disabled
    - newLast7Days
    - total
    type: object
  BatchCreateRecords:
    properties:
      data:
        description: Data is the list of cell values keyed by field UID, one item
          for each record.
        items:
          additionalProperties: true
          type: object
        type: array
    required:
    - data
    type: object
  Changeset:
    properties:
      clientId:
        description: ClientID is the connection that submits the changeset, it is
          empty for the changesets generated by the server.
        type: string
      operations:
        items:
          $ref: '#/definitions/Operation'
        type: array
      rev:
        type: integer
      signature:
        description: Signature is generated by the submitting client to recognize
          its own changeset, it is empty for the changesets generated by the server.
        type: string
      tableUID:
        type: string
    required:
    - clientId
    - operations
    - rev
    - signature
    - tableUID
    type: object
  CreateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    required:
    - label
    - type
    type: object
  CreateFields:
    properties:
      fields:
        items:
          $ref: '#/definitions/CreateField'
        type: array
    required:
    - fields
    type: object
  CreateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  CreateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
    type: object
  CreateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  DeleteAccount:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  DirtyScope:
    properties:
      allRecords:
        type: boolean
      fields:
        type: boolean
      records:
        items:
          type: string
        type: array
      views:
        type: boolean
    type: object
  FetchRecords:
    properties:
      uids:
        items:
          type: string
        type: array
    required:
    - uids
    type: object
  FieldAttrs:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    type: object
  ListAdminProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/AdminProject'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListAdminUsersResp:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/AdminUser'
        type: array
    required:
    - total
    - users
    type: object
  ListChangesetsResp:
    properties:
      changesets:
        items:
          $ref: '#/definitions/Changeset'
        type: array
      hasMore:
        description: HasMore reports there are more changesets after the last one,
          the client should fetch again from its revision.
        type: boolean
    required:
    - changesets
    - hasMore
    type: object
  ListProjectsResp:
    properties:
      projects:
        items:
          $ref: '#/definitions/ProjectListItem'
        type: array
      total:
        type: integer
    required:
    - projects
    - total
    type: object
  ListRecordsResp:
    properties:
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      total:
        description: Total is the number of records matching the query, regardless
          of limit and offset.
        type: integer
    required:
    - records
    - total
    type: object
  ListTablesResp:
    properties:
      tables:
        items:
          $ref: '#/definitions/TableListItem'
        type: array
      total:
        type: integer
    required:
    - tables
    - total
    type: object
  Operation:
    properties:
      actions:
        items:
          $ref: '#/definitions/Action'
        type: array
      command:
        type: string
    required:
    - actions
    - command
    type: object
  Profile:
    properties:
      color:
        description: Color is the avatar color of the user.
        type: string
      createdAt:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      isAdmin:
        description: IsAdmin reports whether the user is a system admin.
        type: boolean
      userName:
        type: string
    required:
    - color
    - createdAt
    - email
    - emailMd5
    - id
    - isAdmin
    - userName
    type: object
  Project:
    properties:
      createdAt:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - owner
    - role
    - uid
    - updatedAt
    type: object
  ProjectListItem:
    properties:
      createdAt:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/UserBrief'
      role:
        description: Role is the permission of the signed-in user on the project.
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      tableCount:
        type: integer
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - owner
    - role
    - tableCount
    - uid
    - updatedAt
    type: object
  ProjectMember:
    properties:
      role:
        enum:
        - owner
        - manager
        - editor
        - viewer
        type: string
      user:
        $ref: '#/definitions/UserBrief'
    required:
    - role
    - user
    type: object
  QueryRecords:
    properties:
      filter:
        items:
          $ref: '#/definitions/QueryRecordsFilter'
        type: array
      group:
        description: Group sorts the records by the field values before Order, so
          records in the same group are adjacent.
        items:
          $ref: '#/definitions/QueryRecordsGroup'
        type: array
      limit:
        description: Limit defaults to 20 when it is not positive.
        type: integer
      offset:
        type: integer
      order:
        items:
          $ref: '#/definitions/QueryRecordsSort'
        type: array
    type: object
  QueryRecordsFilter:
    properties:
      fieldUID:
        type: string
      operation:
        enum:
        - eq
        - neq
        - gt
        - lt
        - gte
        - lte
        - in
        - nin
        - like
        type: string
      value:
        description: Value is a JSON array (e.g. `["a","b"]`) for in / nin, and a
          single value for other operations.
        type: string
    required:
    - fieldUID
    - operation
    - value
    type: object
  QueryRecordsGroup:
    properties:
      fieldUID:
        type: string
    required:
    - fieldUID
    type: object
  QueryRecordsSort:
    properties:
      fieldUID:
        type: string
      order:
        enum:
        - asc
        - desc
        type: string
    required:
    - fieldUID
    type: object
  SLField:
    properties:
      createdAt:
        type: string
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata is the type-specific configuration, e.g. select options
          or the formula expression.
        type: object
      position:
        type: integer
      tableUID:
        type: string
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - label
    - metadata
    - position
    - tableUID
    - type
    - uid
    - updatedAt
    type: object
  SLRecord:
    properties:
      createdAt:
        type: string
      data:
        additionalProperties: true
        description: Data is the cell values keyed by field UID.
        type: object
      tableUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - data
    - tableUID
    - uid
    - updatedAt
    type: object
  SLTable:
    properties:
      createdAt:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  SLView:
    properties:
      config:
        additionalProperties: true
        description: Config is maintained by the frontend, e.g. filter, sort, group,
          hidden fields and field widths.
        type: object
      name:
        type: string
      position:
        type: integer
      tableUID:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
      uid:
        type: string
    required:
    - config
    - name
    - position
    - tableUID
    - type
    - uid
    type: object
  SignIn:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  SignUp:
    properties:
      email:
        type: string
      password:
        description: Password is limited to 64 characters since bcrypt only uses the
          first 72 bytes.
        type: string
      userName:
        type: string
    required:
    - email
    - password
    - userName
    type: object
  SiteInfo:
    properties:
      allowSignUp:
        type: boolean
      passwordMinLength:
        type: integer
      siteName:
        type: string
    required:
    - allowSignUp
    - passwordMinLength
    - siteName
    type: object
  SystemSettings:
    properties:
      allowSignUp:
        description: AllowSignUp reports whether new users can sign up by themselves.
        type: boolean
      passwordMinLength:
        description: PasswordMinLength applies to signing up, changing, creating and
          resetting passwords.
        type: integer
      sessionTTLDays:
        description: SessionTTLDays is the lifetime in days of the new sessions.
        type: integer
      siteName:
        description: SiteName is shown in the page title and the sign-in page.
        type: string
    required:
    - allowSignUp
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  TableListItem:
    properties:
      count:
        type: integer
      createdAt:
        type: string
      name:
        type: string
      projectUID:
        type: string
      uid:
        type: string
      updatedAt:
        type: string
    required:
    - count
    - createdAt
    - name
    - projectUID
    - uid
    - updatedAt
    type: object
  TableSnapshot:
    properties:
      fields:
        items:
          $ref: '#/definitions/SLField'
        type: array
      records:
        items:
          $ref: '#/definitions/SLRecord'
        type: array
      rev:
        type: integer
      table:
        $ref: '#/definitions/SLTable'
      views:
        items:
          $ref: '#/definitions/SLView'
        type: array
    required:
    - fields
    - records
    - rev
    - table
    - views
    type: object
  TransferProjectOwner:
    properties:
      userID:
        type: integer
    required:
    - userID
    type: object
  UpdateField:
    properties:
      label:
        type: string
      metadata:
        additionalProperties: true
        description: Metadata replaces the whole field configuration, it is required
          when the type changes.
        type: object
      type:
        enum:
        - text
        - single_select
        - multi_select
        - datetime
        - number
        - checkbox
        - formula
        type: string
    type: object
  UpdateFieldPosition:
    properties:
      position:
        description: Position is the zero-based index the field moves to, it is clamped
          into the valid range.
        type: integer
    required:
    - position
    type: object
  UpdatePassword:
    properties:
      newPassword:
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  UpdateProfile:
    properties:
      userName:
        type: string
    required:
    - userName
    type: object
  UpdateProject:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  UpdateProjectMember:
    properties:
      role:
        enum:
        - manager
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  UpdateRecord:
    properties:
      data:
        additionalProperties: true
        description: Data replaces all the cell values of the record, keyed by field
          UID.
        type: object
    required:
    - data
    type: object
  UpdateSystemSettings:
    properties:
      allowSignUp:
        type: boolean
      passwordMinLength:
        type: integer
      sessionTTLDays:
        type: integer
      siteName:
        type: string
    required:
    - allowSignUp
    - passwordMinLength
    - sessionTTLDays
    - siteName
    type: object
  UpdateTable:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  UpdateUserSettings:
    properties:
      theme:
        enum:
        - light
        - dark
        - system
        type: string
    required:
    - theme
    type: object
  UserBrief:
    properties:
      color:
        type: string
      email:
        type: string
      emailMd5:
        type: string
      id:
        type: integer
      userName:
        type: string
    required:
    - color
    - email
    - emailMd5
    - id
    - userName
    type: object
  UserSession:
    properties:
      createdAt:
        type: string
      current:
        description: Current reports whether it is the session of the current request.
        type: boolean
      expiresAt:
        type: string
      id:
        type: integer
      ip:
        type: string
      userAgent:
        type: string
    required:
    - createdAt
    - current
    - expiresAt
    - id
    - ip
    - userAgent
    type: object
  UserSettings:
    properties:
      theme:
        description: Theme is the appearance of the user interface.
        enum:
        - light
        - dark
        - system
        type: string
    required:
    - theme
    type: object
  ViewAttrs:
    properties:
      config:
        additionalProperties: true
        type: object
      name:
        type: string
      type:
        enum:
        - grid
        - kanban
        - gallery
        - form
        type: string
    type: object
info:
  contact: {}
  title: Sayrud API
  version: "1.0"
paths:
  /admin/overview:
    get:
      description: Requires the admin.
      operationId: getAdminOverview
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminOverview'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the overview of the system
  /admin/projects:
    get:
      description: Requires the admin. The newest projects come first.
      operationId: listAdminProjects
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
        type: integer
      - description: Page size, defaults to 20
        in: query
        name: pageSize
        type: integer
      - description: Matches the project name
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ListAdminProjectsResp'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List all the projects
  /admin/projects/{projectUID}:
    delete:
      description: Requires the admin.
      operationId: deleteAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete a project
  /admin/projects/{projectUID}/owner:
    put:
      consumes:
      - application/json
      description: Requires the admin. The new owner can be any enabled user, the
        previous owner becomes a manager.
      operationId: transferAdminProject
      parameters:
      - description: Project UID
        in: path
        name: projectUID
        required: true
        type: string
      - description: New owner
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/AdminTransferProject'
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid new owner
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "404":
          description: Project not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Transfer the ownership of a project
  /admin/settings:
    get:
      description: Requires the admin.
      operationId: getSystemSettings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get the system settings
    put:
      consumes:
      - application/json
      description: Requires the admin. The password and session settings apply to
        the later sign-ups and sign-ins.
      operationId: updateSystemSettings
      parameters:
      - description: System settings
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/UpdateSystemSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SystemSettings'
        "400":
          description: Invalid settings
          schema:
            type: string
        "403":
          description: Not an admin
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Update the system settings
  /admin/users:
    get:
      description: Requires the admin. The newest users come first.
      operationId: listAdminUsers
      parameters:
      - description: Page number, starting from 1
        in: query
        name: page
